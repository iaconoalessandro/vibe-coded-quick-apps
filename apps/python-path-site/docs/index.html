<script type="text/markdown" id="md-cheatsheet"># Python + Data Engineering cheat sheet

Search it in VS Code with `cmd+F`, or from the terminal: `grep -n -A5 "DictReader" CHEATSHEET.md`

---

## 1. Terminal (macOS zsh)
| Do | Command |
|---|---|
| where am I / list (incl. hidden) | `pwd` · `ls -la` |
| move / up / home / back | `cd folder` · `cd ..` · `cd ~` · `cd -` |
| make folder (nested) | `mkdir -p a/b/c` |
| copy / move-rename / delete | `cp a b` · `mv a b` · `rm file` (no trash, so be careful) |
| look at a file | `cat f` · `head -5 f` · `tail -5 f` · `less f` (q to quit) |
| count lines / search text | `wc -l f` · `grep -n "word" f` · `grep -rn "word" .` |
| autocomplete / history / stop | `Tab` · `↑` or `ctrl+R` · `ctrl+C` |
| open folder in VS Code / Finder | `code .` · `open .` |

Paths: `/Users/you/x` is absolute, `x/y.csv` is relative to `pwd`, `~` is home, `.` is here, `..` is the parent.
Quote paths with spaces: `cd "My Drive/01_Università"`.

## 2. Virtual environments & packages
```bash
python3 -m venv .venv            # once per project
source .venv/bin/activate        # every new terminal; `deactivate` to leave
which python                     # must end in .venv/bin/python
python -m pip install pytest pyodbc
python -m pip freeze > requirements.txt   # record versions
python -m pip install -r requirements.txt # recreate elsewhere
```
- One venv **per project**. Never `pip install` into conda `(base)` or the system Python.
- `.venv/` goes in `.gitignore`. Commit `requirements.txt` instead.
- VS Code: `cmd+shift+P` → *Python: Select Interpreter* → `.venv`.
- Later (Phase C): `uv venv`, `uv pip install`, `uv run`: the same ideas, 10–100× faster.

## 3. Git & GitHub
```bash
git init                          # new repo
git status                        # ALWAYS look before you commit
git add file.py   /   git add -A  # stage
git commit -m "w03: parse_arff handles quoted commas"
git log --oneline -10             # history
git diff                          # unstaged changes  (git diff --staged: staged)
git restore file.py               # throw away local changes to a file
git push / git pull               # sync with GitHub
gh auth login                     # once: log in GitHub CLI
gh repo create NAME --private --source=. --push   # publish this folder
git clone URL                     # copy a repo locally
```
Branches (Phase C, team work):
```bash
git switch -c fix-parser          # new branch
git push -u origin fix-parser     # publish it
gh pr create --fill               # open a pull request
git switch main && git pull       # back to main, up to date
```
- Commit small and often, with a message that says *what and why*.
- **Never commit** data files, `.env`, passwords, `.venv/`. Put them in `.gitignore` before the first commit.
- Committed a secret by accident? Change the password. Deleting the file doesn't remove it from history.

## 4. VS Code
| Do | Keys |
|---|---|
| command palette | `cmd+shift+P` |
| quick open file | `cmd+P` |
| terminal | `` ctrl+` `` |
| run file | ▶ top-right, or `python file.py` in terminal |
| debug | F5 · breakpoint: click left of line number · step over F10 · into F11 · continue F5 |
| go to definition / rename | F12 · F2 |
| comment line / multi-cursor | `cmd+/` · `opt+click` |
| search all files | `cmd+shift+F` |

## 5. Python core
```python
x = 42; y = 3.14; s = "text"; ok = True; nothing = None

7 / 2 == 3.5     7 // 2 == 3     7 % 2 == 1     2 ** 10 == 1024
x += 1           a, b = b, a     # swap
```

s = "  Data,Eng  "
s.strip() s.lower() s.upper() s.title() s.replace(",", ";")
s.split(",")  ",".join(["a", "b"])  s.startswith("Da")  "Eng" in s

f"{name} has {n} rows"  f"{price:.2f}"  f"{n:,}"  f"{x:>8}"  f"{x=}"  # last one: debug print

else:  ...

area(3) area(3, h=2)

## 6. Data structures
| | create | add | remove | lookup | notes |
|---|---|---|---|---|---|
| **list** `[]` | `[1, 2]` | `.append(x)` `.extend(l)` `.insert(i,x)` | `.pop()` `.remove(x)` `del l[i]` | `l[i]`, `x in l` is **O(n)** | ordered, mutable |
| **tuple** `()` | `(1, 2)` `1,` | no | no | `t[i]` | immutable, hashable → dict key / set item |
| **dict** `{}` | `{"a": 1}` `dict(a=1)` | `d[k] = v` `.update()` `.setdefault(k, [])` | `.pop(k)` `del d[k]` | `d[k]` (KeyError) · `d.get(k, default)` · `k in d` is **O(1)** | insertion-ordered |
| **set** | `set()` `{1, 2}` | `.add(x)` | `.discard(x)` | `x in s` is **O(1)** | unique, unordered · `a & b` `a \| b` `a - b` |

```python
for k, v in d.items(): ...        d.keys()  d.values()
sorted(rows, key=lambda r: (-r["qty"], r["name"]))   # desc qty, then name
[x * 2 for x in nums if x > 0]           # list comprehension
{r["id"]: r for r in rows}               # dict comprehension (index by id)
{r["city"] for r in rows}                # set comprehension (distinct)
from collections import Counter, defaultdict
Counter(words).most_common(3)            # top 3 (ties: first seen)
groups = defaultdict(list); groups[k].append(row)
```

## 7. The row pattern (ETL in plain Python)
A table is a **list of dicts**. Learn these 5 moves by heart:
```python
# 1 filter            (SQL WHERE)
big = [r for r in rows if r["qty"] > 10]
# 2 project / derive  (SQL SELECT)
out = [{"id": r["id"], "total": r["qty"] * r["price"]} for r in rows]
# 3 group + aggregate (SQL GROUP BY)
tot = defaultdict(int)
for r in rows: tot[r["store"]] += r["qty"]
# 4 join              (SQL JOIN): index one side, loop the other. O(n+m)
by_id = {u["id"]: u for u in users}
joined = [{**p, **by_id[p["user_id"]]} for p in posts if p["user_id"] in by_id]
# 5 distinct + surrogate keys (dimension table)
lookup = {}
for r in rows: lookup.setdefault(r["city"], len(lookup) + 1)
```

## 8. Files & formats
```python
from pathlib import Path
p = Path("data") / "file.csv"     p.exists()  p.name  p.suffix  p.parent.mkdir(parents=True, exist_ok=True)
for f in Path("data").glob("*.json"): ...

with open(p, encoding="utf-8") as f:          # text: ALWAYS with + encoding
    for line in f: ...                        # streams; f.read() loads it all
with open(p, "w", encoding="utf-8") as f: f.write("x\n")   # "a" = append
```
**CSV** (always `newline=""`):
```python
import csv
with open(p, encoding="utf-8", newline="") as f:
    rows = list(csv.DictReader(f))                 # header from first line, values are STRINGS
    # csv.DictReader(f, fieldnames=[...])          # file without header
    # csv.reader(f, delimiter=";", quotechar="'")  # lists instead of dicts
with open(p, "w", encoding="utf-8", newline="") as f:
    w = csv.DictWriter(f, fieldnames=["id", "name"]); w.writeheader(); w.writerows(rows)
```
**JSON**:
```python
import json
data = json.load(open(p, encoding="utf-8"))          # file -> dict/list
json.dump(obj, f, indent=2, ensure_ascii=False)       # dict/list -> file
json.loads(text)  json.dumps(obj)                     # string versions
# JSON Lines (.jsonl): one object per line -> stream it
for line in f: obj = json.loads(line)
```
**XML**:
```python
import xml.etree.ElementTree as ET
root = ET.parse(p).getroot()
for el in root.iter("row"):  el.attrib  el.get("id")  el.findtext("age")  el.text  list(el)
# big file: stream + free memory
for event, el in ET.iterparse(p, events=("end",)):
    if el.tag == "record": handle(el); el.clear()
```
**ARFF**: `% comment`, `@relation`, `@attribute name type`, `@data`, then CSV rows. `?` means missing.
Text values may be in `'single'` or `"double"` quotes, and they can contain commas. Test your parser on the nasty rows.

## 9. Exceptions
```python
try:
    n = int(text)
except ValueError:
    n = None
except (KeyError, IndexError) as e:
    log.warning("bad row: %s", e)
else:   ...   # ran only if no exception
finally: ...  # always runs
raise ValueError(f"bad score: {score}")
```
Catch the **specific** exception. A bare `except:` hides bugs. Common ones: `ValueError`, `KeyError`, `IndexError`, `TypeError`, `FileNotFoundError`, `UnicodeDecodeError`, `ZeroDivisionError`.
Reading a traceback: **start from the bottom line** (the error), then go up to the first line that is *your* file.

```python
from datetime import datetime, date, timedelta
dt = datetime.fromisoformat("2024-03-05 21:14:00")      # also accepts "T"
dt = datetime.strptime("05/03/2024 21:14", "%d/%m/%Y %H:%M")
dt.year dt.month dt.day dt.hour dt.weekday()  # Mon=0
dt.strftime("%Y-%m-%d")   dt.date()   dt + timedelta(days=7)
(dt2 - dt1).total_seconds() / 3600   # hours between

date_id = dt.year * 10000 + dt.month * 100 + dt.day   # 20240305

Time zones: decide what "night" means (local vs UTC) and **document it**.

## 11. Regex (`import re`)
```python
re.findall(r"#(\w+)", text)                  # hashtags
re.findall(r"https?://\S+", text)            # URLs
re.search(rf"\b{re.escape(w)}\b", text, re.I)   # whole word, case-insensitive
re.sub(r"\s+", " ", text).strip()            # collapse whitespace
```
`\d` digit · `\w` word char · `\s` space · `\b` word boundary · `.` any · `*` 0+ · `+` 1+ · `?` 0/1 · `( )` group · `[abc]` set. Always use raw strings `r"..."`.

## 12. Stats without pandas
```python
import statistics as st
st.mean(v) st.median(v) st.stdev(v)  # sample std, needs >= 2 values
st.pstdev(v)                         # population std
min(v) max(v) sum(v) len(v)
```
Edge cases to handle explicitly: empty list, one value (stdev raises), std == 0, None values, division by 0.

## 13. Generators (stream big data)
```python
def read_rows(path):
    with open(path, encoding="utf-8", newline="") as f:
        yield from csv.DictReader(f)          # one row at a time, flat memory
def batched(it, n):
    batch = []
    for x in it:
        batch.append(x)
        if len(batch) == n: yield batch; batch = []
    if batch: yield batch
total = sum(int(r["qty"]) for r in read_rows(p))   # generator expression: no list built
```
`itertools.islice(gen, 10)` takes the first 10 · `itertools.batched(it, n)` (3.12+) is built in.

## 14. Databases (DB-API: sqlite3 and pyodbc work the same)
```python
import sqlite3                     # local practice
conn = sqlite3.connect("db.sqlite")    # ":memory:" for throwaway

import os, pyodbc                  # SQL Server (VPN on!)
conn = pyodbc.connect(
    "DRIVER={ODBC Driver 18 for SQL Server};SERVER=...;DATABASE=Group_XX_DB;"
    f"UID={os.environ['DB_USER']};PWD={os.environ['DB_PASSWORD']};TrustServerCertificate=yes")

cur = conn.cursor()
cur.execute("SELECT * FROM t WHERE year = ? AND city = ?", (2024, "Pisa"))   # ? placeholders
row = cur.fetchone();  rows = cur.fetchall();  chunk = cur.fetchmany(1000)
cols = [d[0] for d in cur.description]
cur.fast_executemany = True                      # pyodbc only: huge speed-up
cur.executemany("INSERT INTO t (a, b) VALUES (?, ?)", list_of_tuples)
conn.commit()                                    # nothing is saved until commit
conn.rollback()                                  # undo since last commit
conn.close()
```
- **Never** build SQL with f-strings around *values* (SQL injection, quote bugs like `O'Brien`). Use `?`.
- Table/column *names* can't be `?`, so validate them (`name.isidentifier()`).
- Bulk load: batches of 1,000–10,000 rows, `fast_executemany`, commit per batch or at the end. Load dimensions before facts (foreign keys).
- Mac + SQL Server: `brew tap microsoft/mssql-release https://github.com/Microsoft/homebrew-mssql-release && brew install msodbcsql18`, then `pip install pyodbc`.
- Sampling on SQL Server: `SELECT TOP (n) ...`, `TABLESAMPLE (5 PERCENT)` (approximate, page-based), or `WHERE ABS(CHECKSUM(NEWID())) % 100 < 5`. Know the trade-offs.
- Credentials: a `.env` file (in `.gitignore`) plus `os.environ`, or `export DB_USER=...` in the terminal.

## 15. Scripts: `__main__`, argparse, logging
```python
import argparse, logging, sys
log = logging.getLogger(__name__)

def main(argv=None):
    p = argparse.ArgumentParser(description="...")
    p.add_argument("input")
    p.add_argument("--out-dir", default="out")
    p.add_argument("--batch-size", type=int, default=1000)
    p.add_argument("--dry-run", action="store_true")
    p.add_argument("-v", "--verbose", action="count", default=0)
    args = p.parse_args(argv)
    logging.basicConfig(level=logging.INFO if args.verbose else logging.WARNING,
                        format="%(asctime)s %(levelname)s %(message)s")
    log.info("reading %s", args.input)
    return 0

if __name__ == "__main__":   # only when run directly, not when imported
    sys.exit(main())
```

Timing: `import time; t0 = time.perf_counter(); ...; log.info("took %.1fs", time.perf_counter() - t0)`

## 17. Gotchas that cost points
| Trap | Wrong | Right |
|---|---|---|
| mutable default arg | `def f(x, acc=[])` (shared across calls!) | `def f(x, acc=None): acc = [] if acc is None else acc` |
| aliasing | `b = a; b.append(1)` changes `a` | `b = a.copy()` / `list(a)` / `copy.deepcopy(a)` for nested |
| `is` vs `==` | `if x is 5` | `==` for values; `is` only for `None`: `if x is None` |
| float equality | `0.1 + 0.2 == 0.3` → False | `math.isclose(a, b)` / `pytest.approx` |
| CSV values are strings | `"10" > "9"` → False | convert: `int(r["qty"])` |
| modifying a list while looping | `for x in l: l.remove(x)` | build a new list |
| integer division | `/` always gives float | `//` floor division |
| forgot `return` | function returns `None` | check every path returns |
| shadowing builtins | `list = [...]`, `dict = ...`, `sum = 0` | pick other names |
| file not closed / wrong encoding | `open(p).read()` | `with open(p, encoding="utf-8")` |
| relative paths | works only from one folder | `Path(__file__).parent / "data"` or pass paths as args |

## 18. Complexity cheat sheet (you know the theory; here is Python's cost)
| Operation | list | dict / set |
|---|---|---|
| `x in` | O(n) | **O(1)** |
| get by index / key | O(1) | O(1) |
| append / add | O(1) amortized | O(1) |
| insert/delete at front | O(n) (use `collections.deque`) | n/a |
| sort | O(n log n) (`sorted`, stable) | n/a |
Rule: membership checks inside a loop → use a **set** or **dict**, never a list. That's the difference between 1 second and 1 hour on the DSS data.

## Why this week exists
A notebook remembers whatever cells you ran, in whatever order you ran them. Run cell 5, edit cell 2, rerun cell 7, and the result depends on history nobody can see. That is why courses, exams and companies want **scripts**. A `.py` file runs top to bottom, the same way every time. It can be imported, tested, put in git, reviewed, and scheduled on a server. Your DSS scripts will run against a database for minutes at a time, so they have to be scripts.

This week is pure setup. It's boring, and it's the foundation of everything else.

## The mental model
```text
Terminal ──runs──▶ python (from .venv) ──reads──▶ exercises/w00_setup.py
   │                         ▲
   └── pytest ── imports ────┘      git ── snapshots ──▶ GitHub
```
- **Terminal**: a text way to drive the computer. You're always *in* a folder (`pwd`), and relative paths start there.
- **Interpreter**: `python file.py` reads the file top to bottom and executes it. `import x` runs `x.py` once and gives you its names.
- **Virtual environment**: a private Python + packages per project, in `.venv/`. Activate it in every new terminal, and check with `which python`.
- **pytest**: finds `tests/test_*.py`, runs every `test_*` function, and reports which `assert`s failed. Red, then code, then green.
- **git**: saves snapshots of your folder. `add` chooses what goes in the snapshot, `commit` takes it, `push` copies it to GitHub.

## Reading a traceback
```text
Traceback (most recent call last):
  File ".../tests/test_w00_setup.py", line 24, in test_average_of_positive_no_positives
    assert average_of_positive([]) == 0.0
  File ".../exercises/w00_setup.py", line 54, in average_of_positive
    return total / count
ZeroDivisionError: division by zero
```
Read it **bottom-up**. The last line is *what* went wrong. The line above it is *where*, and here that's your file, line 54. Everything above that is *how you got there*. Ignore frames inside Python's own libraries and look for the first frame in **your** files.

## The debugger beats print()
In VS Code, click left of a line number to set a red-dot breakpoint, then **Run › Start Debugging** (F5). Execution stops there. Hover over variables, or watch them in the left panel. F10 runs one line, F11 steps into a function call. You'll use this all the way through the DSS project.

> **Remember**
> - New terminal? `source .venv/bin/activate`, then `which python`.
> - Read tracebacks from the bottom. Find the first line that is your code.
> - `git status` before every commit. `.venv/`, `.env` and data files never go in git.
> - A test is just a function with `assert`. Never edit a test to make it pass.

<script type="text/markdown" id="md-w1">
## Why this week exists
Everything later (CSV parsing, star schemas, SQL loading) is built from five things: **values, names, conditions, loops, functions**. You know the algorithms. This week is about getting the syntax into your fingers, so writing a loop takes 10 seconds, not 10 minutes.

## Values, types, names
```python
qty = 5            # int
price = 12.5       # float
store = "S1"       # str
active = True      # bool
nothing = None     # "no value", common in dirty data
type(qty)          # <class 'int'>
int("42"), float("2.5"), str(7)   # conversions; int("4.2") raises ValueError
```
A name is a label stuck on an object. `qty = qty + 1` makes a new int and moves the label.

## Strings (immutable: methods return NEW strings)
```python
s = "  Truth Social  "
s.strip().lower()            # 'truth social'
s.split()                    # ['Truth', 'Social']
"-".join(["a", "b"])         # 'a-b'
s[2:7], s[-1], s[::-1]       # slicing: start inclusive, end exclusive
f"{store}: {qty} x {price:.2f} = {qty * price:.2f}"   # 'S1: 5 x 12.50 = 62.50'
```

## Conditions and loops
```python
if qty > 10:
    size = "big"
elif qty > 0:
    size = "small"
else:
    size = "none"

for i in range(3):           # 0, 1, 2   (end excluded, like slicing)
    ...
for i, word in enumerate(["a", "b"]):   # index and value together
    ...
while n != 1:                # when you don't know how many steps
    ...
```
Truthiness: `""`, `0`, `[]`, `{}` and `None` are false, and everything else is true. So `if not name:` catches both `""` and `None`.

## Functions: `return` vs `print`
```python
def total(qty, price, vat=0.22):        # vat has a default
    """Price including VAT."""
    return qty * price * (1 + vat)      # gives the value back to the caller

x = total(2, 10)          # 24.4
y = print(total(2, 10))   # prints 24.4, but y is None
```
`print` shows something to a human. `return` hands a value to the next piece of code. Tests check returns.

## Worked example (do the same for `count_vowels`)
"Count words longer than 3 letters":
```python
def count_long_words(text):
    count = 0                    # 1. an accumulator
    for word in text.split():    # 2. loop over pieces
        if len(word) > 3:        # 3. a condition
            count += 1           # 4. update
    return count                 # 5. return after the loop, not inside it
```
Most of this week's exercises follow this accumulator pattern.

> **Remember**
> - `=` assigns, `==` compares.
> - Indentation is syntax: 4 spaces. The body of `if`/`for`/`def` is indented.
> - `range(a, b)` and `s[a:b]` exclude `b`.
> - Strings never change in place: `s.upper()` returns a new string.
> - A function without `return` returns `None`.
</script>
<script type="text/markdown" id="md-w2">
## Why this week exists
Data engineering in plain Python is mostly **moving rows between lists and dicts**. The DSS project bans pandas, so `dict` and `list` *are* your dataframe. Get this week right and the project becomes plumbing.

## The four containers
| | literal | mutable | ordered | `x in` cost | use for |
|---|---|---|---|---|---|
| list | `[1, 2]` | yes | yes | O(n) | sequences, rows |
| tuple | `(1, 2)` | no | yes | O(n) | fixed records, dict keys |
| dict | `{"a": 1}` | yes | insertion | **O(1)** | lookup by key, grouping |
| set | `{1, 2}` | yes | no | **O(1)** | distinct values, "seen before?" |

## Aliasing: the bug that eats afternoons
```python
a = [1, 2]
b = a          # NOT a copy: two names, one list
b.append(3)
a              # [1, 2, 3]
c = a.copy()   # a real (shallow) copy; nested lists still shared -> copy.deepcopy
```
Functions receive the same object, so a function that `.append`s to its argument changes the caller's list.

## A table = a list of dicts
```python
rows = [
    {"user": "u1", "hour": 22, "likes": 10},
    {"user": "u2", "hour": 9,  "likes": 3},
    {"user": "u1", "hour": 23, "likes": 7},
]
# GROUP BY user, SUM(likes)
totals = {}
for r in rows:
    totals[r["user"]] = totals.get(r["user"], 0) + r["likes"]
# {'u1': 17, 'u2': 3}

from collections import defaultdict, Counter
by_user = defaultdict(list)
for r in rows:
    by_user[r["user"]].append(r)          # group whole rows
Counter(r["user"] for r in rows)          # Counter({'u1': 2, 'u2': 1})
```

## Comprehensions and sorting
```python
[r["likes"] for r in rows if r["hour"] >= 20]            # [10, 7]
{r["user"] for r in rows}                                  # {'u1', 'u2'}
sorted(rows, key=lambda r: (-r["likes"], r["user"]))       # likes desc, then user
```
`sorted()` returns a new list. `list.sort()` sorts in place and returns `None`.

## Recursion, Python edition
You know the theory. In Python:
```python
def total_size(folder):              # folder = {"files": [3, 5], "subfolders": [...]}
    return sum(folder["files"]) + sum(total_size(f) for f in folder["subfolders"])
```
Python stops at about 1000 nested calls (`RecursionError`), so use recursion for trees and divide-and-conquer, and loops for long sequences. The P4DS exam always asks for one recursive function.

> **Remember**
> - Need "have I seen this?" inside a loop? Use a **set**, never a list.
> - `b = a` doesn't copy. `a.copy()` does (shallowly).
> - Dict keys must be hashable: tuples yes, lists no.
> - `d[k]` raises KeyError. `d.get(k, default)` doesn't.
> - Don't add or remove items in a list while looping over it. Build a new one.
</script>
<script type="text/markdown" id="md-w3">
## Why this week exists
DSS Assignment 1 hands you **CSV, XML, JSON and ARFF**, some of it large. Every reader you write should return the same shape (a list of dicts, or a generator of dicts), so cleaning and modelling never care where the data came from. This week you build those readers on the lab's census and sales files.

## Opening files the right way
```python
from pathlib import Path
path = Path("practice_data") / "jobs.csv"
with open(path, encoding="utf-8") as f:   # `with` closes the file even if an error happens
    for line in f:                         # streams line by line: fine for 10 GB
        ...
```
Always pass `encoding="utf-8"`. Otherwise the result depends on the machine (Windows VM ≠ Mac). Use `newline=""` for CSV files.

## CSV: let the module handle quotes
```python
'7066,"Rossi, Mario",5'.split(",")   # ['7066', '"Rossi', ' Mario"', '5']  <- wrong
import csv
with open(path, encoding="utf-8", newline="") as f:
    for row in csv.DictReader(f):    # {'id': '7066', 'name': 'Rossi, Mario', 'qty': '5'}
        qty = int(row["qty"])        # values are ALWAYS strings
```

## JSON maps to Python directly
`object` → `dict`, `array` → `list`, `null` → `None`, `true` → `True`. `json.load(f)` and `json.dump(obj, f, indent=2, ensure_ascii=False)`.
Many big dumps are **JSON Lines**: one object per line. Read those line by line with `json.loads(line)`.

## XML: attributes vs elements
```text
<row id="1" age="39"/>                      ← attributes: el.attrib
<census><id>1</id><age>39</age></census>    ← elements: el.findtext("age")
```
`ET.parse()` builds the whole tree in memory. For a big file, use `ET.iterparse()` and `elem.clear()` after each record. Memory stays flat, which matters for DSS events.

## ARFF
A header (`@relation`, `@attribute name type`), then `@data` and CSV-like rows. `?` means missing. Text can be quoted. **The real project file mixes quote styles and has commas and apostrophes inside text.** Build your parser on `sales.arff`, then break it on purpose with nasty test rows. Your test file is your proof.

## Exceptions: expect bad data
```python
try:
    likes = int(raw)
except ValueError:          # catch the SPECIFIC error
    likes = None            # decide, and document, what bad input becomes
```
Never use a bare `except:`. It also swallows typos and Ctrl+C.

## Start your project repo now
Create `~/code/lds-project` with the layout in the README (`src/`, `data/` git-ignored, `.env` git-ignored). Copy nothing from `python-path`. Write the readers again for the real files, using what you learned here.

> **Remember**
> - `with open(..., encoding="utf-8")`, every time.
> - CSV values are strings. Convert on purpose, and handle `?` and `""`.
> - Never `.read()` or `ET.parse()` a huge file. Stream it.
> - Catch specific exceptions, and keep a count of the rows you rejected (that's report material).

## Why this week exists
This week covers DSS Assignments 1–4: find data-quality issues, derive features (time of day, season, hashtags, categories), design a star schema, and split the data into one CSV per table. You practise every move on `sales.arff` and `loans.json`.

## Dates
```python
from datetime import datetime
dt = datetime.fromisoformat("2024-03-05 21:14:00")   # "T" separator works too
dt.hour, dt.month, dt.weekday()                      # 21, 3, 1 (Monday=0)
(dt2 - dt1).total_seconds() / 3600                   # hours between
```
Decide your conventions once and write them in the report: time zone, whether 8:00 counts as day or night, which months make each season.

## A data-quality checklist (run it on every source)
| Check | How in plain Python |
|---|---|
| completeness | count `None` / `""` / `"?"` per column (`missing_report`) |
| uniqueness | `find_duplicates(rows, ["id"])` with a set of keys |
| validity | parse types with try/except and count the failures |
| consistency | same date format? same user id in posts and users? (set differences) |
| outliers | `statistics.mean` / `stdev`, flag `abs(x - mean) > k * std` |

## Text features
```python
re.findall(r"#(\w+)", text)                          # hashtags
re.search(rf"\b{re.escape(w)}\b", text, re.I)         # whole-word keyword
```
Rule-based categories (`categorize`) are **interpretable**, and Assignment 2 asks for exactly that. Build a small keyword dict per category, measure how many posts land in "other", and iterate.

## Modules: reuse your own code
```python

if __name__ == "__main__":                     # runs only when executed, not when imported
    main()
```

## Star schema refresher (see your DW book)
```text
            dim_date (date_id PK, day, month, year, season ...)
                 │
dim_store ── fact_sales ── dim_title
(store_key PK)   (store_key FK, title_key FK, date_id FK, qty)
```
1. **Grain first**: one fact row = one *what*? (one sale line; in DSS, one event).
2. **Measures**: numbers you aggregate (qty, likes).
3. **Dimensions**: descriptive context, each with an integer **surrogate key** made with a dict `natural value → id`.
4. Facts store only keys and measures. Integrity check: every FK exists in its dimension (a set subset test).

> **Remember**
> - Decide the grain before anything else.
> - `statistics.stdev` needs 2 or more values. Handle 0 and 1 explicitly.
> - Every cleaning decision goes in the report: what, how many rows, why.
> - Surrogate keys come from a dict, so a lookup costs O(1) per row.

<script type="text/markdown" id="md-w5">
## Why this week exists
Assignment 5 loads your CSVs into SQL Server **efficiently**, and Assignment 6 pulls at least 5% of a large events table into JSON. Both use the DB-API. You learn it on `sqlite3` (no server, instant feedback), then switch the connection to `pyodbc`.

## The DB-API in 8 lines
```python
conn = sqlite3.connect(":memory:")          # pyodbc.connect(conn_str) for SQL Server
cur = conn.cursor()
cur.execute("CREATE TABLE t (id INTEGER, name TEXT)")
cur.execute("INSERT INTO t VALUES (?, ?)", (1, "O'Brien"))     # ? placeholders
cur.executemany("INSERT INTO t VALUES (?, ?)", [(2, "a"), (3, "b")])
conn.commit()                               # until now, nothing is saved
cur.execute("SELECT id, name FROM t WHERE id > ?", (1,))
rows = cur.fetchall()                       # or fetchone() / fetchmany(1000)
```
Never write `f"... VALUES ('{name}')"`. The apostrophe in O'Brien breaks it, and so does a malicious string (SQL injection).

## Generators: data that flows instead of piling up
```python
def read_rows(path):
    with open(path, encoding="utf-8", newline="") as f:
        yield from csv.DictReader(f)     # produces one row when asked

for batch in batched(read_rows(p), 5000):
    cur.executemany(sql, [tuple(r.values()) for r in batch])
conn.commit()
```
Memory stays the same whether the file has a thousand rows or ten million.

## Experiment (do it, write the numbers down)
Insert 100,000 rows into sqlite three ways: (a) `execute` + `commit` per row, (b) `execute` per row + one commit, (c) `executemany` in batches of 5,000. Time each with `time.perf_counter()`. Put the table in your notes: it's the "efficiency and scalability" paragraph of your report.

brew tap microsoft/mssql-release https://github.com/Microsoft/homebrew-mssql-release
HOMEBREW_ACCEPT_EULA=Y brew install msodbcsql18
python -m pip install pyodbc

conn = pyodbc.connect(sqlserver_connection_string(db_settings(os.environ)))
cur = conn.cursor()
cur.fast_executemany = True      # without it, pyodbc sends rows one by one
print(cur.execute("SELECT @@VERSION").fetchone()[0])

If the Mac driver fights you, run the same script inside the Windows VM. The code doesn't change.

## Pulling a sample out (Assignment 6 shape)
Think about it before coding. Should the sample be **random rows**, **random posts with all their events**, or **a time window**? Each answers different questions. Know `TOP`, `TABLESAMPLE` and `NEWID()` (see the cheat sheet) and their trade-offs. Stream the result with `fetchmany` into a JSON file (`export_query_to_json`).

> **Remember**
> - `?` placeholders for values, validated identifiers for names.
> - `commit()`, or it never happened.
> - Load dimensions before facts, because of foreign keys.
> - `fast_executemany = True` on pyodbc.
> - Credentials come from the environment, never from code or git.

Graders and future teammates will run your code, not read it. A script with **arguments, logs and exit codes** can be run by anyone, on any data, and tells them what happened. This is also build week: run your DSS Assignments 1–6 end to end from a clean clone.

## The shape of every script
```python
log = logging.getLogger(__name__)

def main(argv=None):                    # argv=None -> sys.argv; tests pass a list
    args = build_parser().parse_args(argv)
    logging.basicConfig(level=log_level(args.verbose), format="%(levelname)s %(message)s")
    log.info("reading %s", args.input)
    ...
    return 0                            # 0 = success, anything else = failure

if __name__ == "__main__":
    sys.exit(main())
```
`print` is for program output. `logging` is for what the program is doing (progress, warnings, row counts), and you can turn it up with `-v` without touching code.

<script type="text/markdown" id="md-w7b">
## Why this week exists
Part 2 (MDX queries, dashboards, the 10-page report) is due **18 December**. MDX reads strangely at first because it's built around **axes** and **tuples**, not rows.

## The core shape
```sql
SELECT
  { [Measures].[Qty] }                                  ON COLUMNS,
  NON EMPTY [Store].[Store Id].[Store Id].MEMBERS       ON ROWS
FROM [Sales]
WHERE ( [Date].[Year].&[1994] )                          -- the slicer: a filter
```
- **Member**: one value of a dimension, like `[Date].[Year].&[1994]`.
- **Tuple** `( , )`: one member per dimension, which is one cell's coordinates.
- **Set** `{ , }`: a list of members or tuples, placed on an axis.
- `A * B` (CROSSJOIN) puts every combination on rows. `NON EMPTY` drops empty rows.

## Calculated members: where the work happens
```sql
WITH MEMBER [Measures].[Qty prev year] AS
  ( [Measures].[Qty], [Date].[Calendar].CURRENTMEMBER.PREVMEMBER )
MEMBER [Measures].[YoY %] AS
  IIF( [Measures].[Qty prev year] = 0, NULL,
       ([Measures].[Qty] - [Measures].[Qty prev year]) / [Measures].[Qty prev year] ),
  FORMAT_STRING = "Percent"
SELECT { [Measures].[Qty], [Measures].[YoY %] } ON COLUMNS,
       [Date].[Calendar].[Year].MEMBERS ON ROWS
FROM [Sales]
```
- `PREVMEMBER` is the previous member at the same level. `PARALLELPERIOD([Date].[Calendar].[Year], 1, member)` is the same position one year earlier (for example, the same season last year).
- `[All]` members give grand totals for free. Put them on an axis for an "overall" row.
- `FILTER(set, condition)`, `ORDER(set, expr, DESC)`, `TOPCOUNT(set, n, expr)`.
- Distinct counts need a **distinct count measure** in the cube, which matters when "count each file once" is the question.

> **Remember**
> - One cell = one tuple. Anything you don't specify comes from the slicer or the `[All]` member.
> - Guard every division with `IIF(x = 0, NULL, ...)`.
> - Write the query in words first: "for each X, show Y, compared to Z."
</script>

// wrap tables for sideways scroll and give every code block a copy button
function enhance(root) {
  root.querySelectorAll("table").forEach((t) => {
    t.querySelectorAll("th").forEach((th) => { if (!th.textContent.trim()) th.innerHTML = '<span class="visually-hidden">Item</span>'; });
    if (t.parentElement.classList.contains("tablewrap")) return;
    // the wrapper scrolls sideways on narrow screens, so keyboard users must be able to focus it
    const w = document.createElement("div"); w.className = "tablewrap"; w.tabIndex = 0; w.setAttribute("role", "region"); let hd = t.previousElementSibling; while (hd && !/^H[1-4]$/.test(hd.tagName)) hd = hd.previousElementSibling;
    hd = hd || t.closest("section")?.querySelector("h1, h2, h3");
    w.setAttribute("aria-label", "Table" + (hd ? ": " + hd.textContent.trim() : ""));
    t.before(w); w.appendChild(t);
  });
  // markdown task lists ("- [ ] ...") become real, saved ticks; the key is derived from the item text so it stays stable
  root.querySelectorAll('li > input[type="checkbox"][disabled]').forEach((box) => {
    const li = box.parentElement, text = li.textContent.trim();
    let h = 0; for (const ch of text) h = (h * 31 + ch.codePointAt(0)) >>> 0;
    const lab = document.createElement("label"); lab.className = "md-check";
    box.removeAttribute("disabled"); box.dataset.task = "chk-" + h.toString(36); box.checked = !!state.done[box.dataset.task];
    while (li.firstChild) lab.appendChild(li.firstChild);
    li.appendChild(lab); li.classList.add("md-check-item");
  });
  requestAnimationFrame(() => markScrollers(root));

    if (pre.parentElement.classList.contains("codeblock")) return;
    const box = document.createElement("div"); box.className = "codeblock"; pre.before(box); box.appendChild(pre);
    pre.tabIndex = 0;
    const b = document.createElement("button"); b.type = "button"; b.className = "copy"; b.innerHTML = COPY_ICON + "<span>Copy</span>";
    b.setAttribute("aria-label", "Copy code"); box.appendChild(b);
  });
}
// say so under a table that is wider than the screen; code blocks get the visible scrollbar only
function markScrollers(root) {
  root.querySelectorAll(".tablewrap").forEach((w) => {
    const over = w.scrollWidth > w.clientWidth + 1, note = w.nextElementSibling && w.nextElementSibling.classList.contains("scrollnote") ? w.nextElementSibling : null;
    if (over && !note) w.insertAdjacentHTML("afterend", '<p class="scrollnote">Scroll sideways to see every column.</p>');
    if (!over && note) note.remove();

}

window.addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => markScrollers(document), 200); });
document.addEventListener("click", (e) => {
  const b = e.target.closest(".copy"); if (!b) return;

/* ============ PARTS (week page, project, cheat sheet) ============ */
/* ============ WEEK PAGE ============ */
const BACK = ARROW.replace("<svg ", '<svg style="transform:scaleX(-1)" ');
function wkNeighbours(w) {

}
function wkGroups(w) {
  const groups = [];
  w.tasks.forEach((x) => {
    // weeks without file sections group their exercises under one plain heading
    const name = SECTIONS[w.id] || !isExercise(x) ? sectionOf(w, x) : "Exercises", last = groups[groups.length - 1];
    if (last && last.name === name) last.items.push(x); else groups.push({ name, items: [x] });

}
function wkTask(x) {

}
function wkQuestion(w, q, i) {
  const key = `${w.id}-q${i}`, picked = state.quiz[key], answered = picked !== undefined;
  const opts = q.o.map((o, j) => {
    const cls = !answered ? "" : j === q.a ? " wk-right" : j === picked ? " wk-wrong" : "";

    return `<li><button type="button" class="wk-opt${cls}" data-week="${w.id}" data-qi="${i}" data-oi="${j}" ${answered ? 'aria-disabled="true"' : ""}>${o}${note}</button></li>`;
  }).join("");
  const verdict = !answered ? "" : `<p class="wk-verdict"><b class="${picked === q.a ? "wk-ok" : "wk-no"}">${picked === q.a ? "Right." : "Not quite."}</b> ${q.w}</p>`;
  return `<div class="wk-q" id="${key}"><p class="wk-qt"><span class="wk-qn">${i + 1}.</span> ${q.q}</p>

function renderWeek(id) {
  const w = WEEKS.find((x) => x.id === id);

function wkRefreshTask(id) {

document.addEventListener("click", (e) => {

/* ============ PROJECT ============ */
// "W3–W4" -> {text: "Week 3–4", id: "w3"}; "W7b" -> Week 8 (the last week's id stays w7b)
function pjWeek(code) {
  const m = code.match(/^W(\d+)(b?)(?:–W(\d+))?(.*)$/);
  if (!m) return { text: code, id: null };
  const id = "w" + m[1] + m[2];
  const w = WEEKS.find((x) => x.id === id);
  const n = w ? weekName(w).replace("Week ", "") : m[1];
  return { text: `Week ${n}${m[3] ? "–" + m[3] : ""}${m[4]}`, id: w ? id : null };
}
function pjDays(deadline) {
  const n = daysUntil(deadline);
  return n > 1 ? `${n} days left` : n === 1 ? "1 day left" : n === 0 ? "today" : "passed";
}
const pjCount = () => `<b>${ASSIGN.filter(([id]) => state.done["dss-" + id]).length} of ${ASSIGN.length}</b> done`;

function renderProject() {
  const rows = ASSIGN.map(([id, what, tool, wk]) => {
    const w = pjWeek(wk), py = tool.startsWith("Python");
    const prep = w.id ? `<a href="#${w.id}">${esc(w.text)}</a>` : esc(w.text);
    const row = `<tr class="pj-row${py ? " pj-py" : ""}">
      <td class="pj-done"><input type="checkbox" data-task="dss-${esc(id)}" id="dss-${esc(id)}" ${state.done["dss-" + id] ? "checked" : ""}></td>
      <th scope="row" class="pj-id"><label for="dss-${esc(id)}">${esc(id)}</label></th>
      <td class="pj-what"><label for="dss-${esc(id)}">${esc(what)}</label></td>
      <td class="pj-tool">${py ? '<svg class="pj-pymark" viewBox="0 0 8 8" aria-hidden="true"><rect width="8" height="8"/></svg>' : ""}${esc(tool)}</td>
      <td class="pj-prep">${prep}</td></tr>`;
    const divider = id === "A14" ? `<tr class="pj-deadline"><td colspan="5">Part 1 deadline · Fri 11 Dec</td></tr>` : "";
    return row + divider;
  }).join("");
  $("#view").innerHTML = `
    <h1 class="pj-h1">DSS project</h1>
    <p class="pj-lede">LDS 2026–27 · Truth Social data warehouse. Every assignment, the tool it requires, and the week that prepares you for it.</p>
    <dl class="pj-deadlines">
      <div><dt>Part 1 · Fri 11 Dec</dt><dd>A1–A14 code, the group database freezes</dd><dd class="pj-left">${pjDays(DEADLINE)}</dd></div>
      <div><dt>Part 2 · Fri 18 Dec</dt><dd>MDX queries, dashboards, report of at most 10 pages</dd><dd class="pj-left">${pjDays(PART2)}</dd></div>
    </dl>
    <h2 class="pj-h2">Assignments</h2>
    <p class="pj-count" id="pj-count">${pjCount()}</p>

      <thead><tr><th scope="col" class="pj-done"><span class="visually-hidden">Done</span></th><th scope="col">#</th><th scope="col">What</th><th scope="col">Tool</th><th scope="col">Prepared in</th></tr></thead>
      <tbody>${rows}<tr class="pj-deadline"><td colspan="5">Part 2 deadline · Fri 18 Dec</td></tr></tbody>
    </table>
    <h2 class="pj-h2">How we work on graded code</h2>
    <p class="pj-p">The path teaches every technique on parallel data (census, sales, loans). You write the Truth Social code. Claude explains, reviews your code and points at problems, but doesn't write assignment solutions. What you hand in has to be something you can defend at the oral.</p>
    <h2 class="pj-h2">Rules that shape the code</h2>
    <ul class="pj-rules">
      <li><b>No pandas-like packages</b> from A3 on: <code>csv</code>, <code>json</code>, <code>xml.etree</code>, <code>datetime</code>, <code>statistics</code>, <code>pyodbc</code>.</li>
      <li>A5 is graded on <b>efficiency and scalability</b>: batching, <code>fast_executemany</code>, streaming, measured timings.</li>
      <li>A11 demands <b>documented edge cases</b>. Keep a running <code>DECISIONS.md</code> from week 3 on.</li>

/* ---- Cheat sheet view: one DOM build per visit; filtering only toggles hidden and <mark>s ---- */
let csQuery = "";
function renderCheat() {
  setWeekColour(null);
  const src = document.createElement("div");
  src.innerHTML = md("md-cheatsheet");
  // drop the markdown's own h1, intro line and rule: everything before the first h2
  while (src.firstChild && src.firstChild.nodeName !== "H2") src.firstChild.remove();
  const body = document.createElement("div");
  body.className = "cs-body prose";
  let sec = null;
  [...src.childNodes].forEach((n) => {
    if (n.nodeName === "H2") {
      sec = document.createElement("section");
      sec.className = "cs-sec";
      sec.id = "cs-" + body.children.length;
      n.textContent = n.textContent.replace(/^\d+\.\s*/, "");
      n.tabIndex = -1;
      sec.appendChild(n);
      body.appendChild(sec);
    } else if (sec) sec.appendChild(n);
  });
  const secs = [...body.children];
  const wide = matchMedia("(min-width: 601px)").matches;
  $("#view").innerHTML = `
    <h1>Cheat sheet</h1>
    <p class="cs-lede">The same text as <code>CHEATSHEET.md</code> in your repo.</p>
    <div class="cs-search">
      <label for="cs-q">Search the cheat sheet</label>
      <div class="cs-field"><input id="cs-q" name="q" type="search" autocomplete="off" spellcheck="false" placeholder="DictReader, commit…" aria-describedby="cs-count">
        <span class="cs-count" id="cs-count" aria-live="polite"></span></div>
    </div>
    <details class="cs-index"${wide ? " open" : ""}><summary>Sections</summary>
      <ul>${secs.map((s, i) => `<li><a href="#cheat" data-cs="${i}">${esc(s.querySelector("h2").textContent)}</a></li>`).join("")}</ul>
    </details>
    <p class="cs-empty" hidden></p>`;
  $("#view").appendChild(body);
  enhance(body);
  // search text per section, without the copy buttons' labels
  secs.forEach((s) => { const c = s.cloneNode(true); c.querySelectorAll(".copy").forEach((b) => b.remove()); s.csText = c.textContent.toLowerCase(); });
  const q = $("#cs-q");
  q.value = csQuery;
  q.addEventListener("input", () => { csQuery = q.value; csFilter(secs); });
  q.addEventListener("keydown", (e) => { if (e.key === "Escape" && q.value) { e.preventDefault(); q.value = csQuery = ""; csFilter(secs); } });
  $(".cs-index").addEventListener("click", (e) => {
    const a = e.target.closest("[data-cs]"); if (!a) return;
    e.preventDefault(); // the router owns the hash
    const s = secs[a.dataset.cs];
    if (s.hidden) { q.value = csQuery = ""; csFilter(secs); }
    s.scrollIntoView();
    s.querySelector("h2").focus({ preventScroll: true });
  });
  csFilter(secs);
}

function csFilter(secs) {
  const words = csQuery.toLowerCase().split(/\s+/).filter(Boolean);
  let shown = 0;
  secs.forEach((s) => {
    s.querySelectorAll("mark.cs-hit").forEach((m) => m.replaceWith(m.textContent));
    s.normalize();
    s.hidden = words.some((w) => !s.csText.includes(w));
    if (!s.hidden) { shown++; if (words.length) csMark(s, words); }
  });
  $("#cs-count").textContent = words.length ? `${shown} of ${secs.length} sections` : `${secs.length} sections`;
  const empty = $(".cs-empty");
  empty.hidden = shown > 0;
  if (!shown) empty.innerHTML = `Nothing matches <b>“${esc(csQuery.trim())}”</b>. Try one word, like <code>DictReader</code> or <code>commit</code>.`;
}

function csMark(root, words) {
  const re = new RegExp(words.map((w) => w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|"), "gi");
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode: (n) => (n.parentElement.closest(".copy") ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT),
  });
  const nodes = [];
  while (walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach((n) => {
    if (!re.test(n.nodeValue)) return;
    re.lastIndex = 0;
    const frag = document.createDocumentFragment();
    let last = 0;
    n.nodeValue.replace(re, (m, at) => {
      frag.append(n.nodeValue.slice(last, at));
      const mk = document.createElement("mark"); mk.className = "cs-hit"; mk.textContent = m; frag.append(mk);
      last = at + m.length;
    });
    frag.append(n.nodeValue.slice(last));
    n.replaceWith(frag);
  });
}

// "/" jumps to the search from anywhere on the cheat sheet
document.addEventListener("keydown", (e) => {
  if (view !== "cheat" || e.key !== "/" || e.metaKey || e.ctrlKey || e.altKey) return;
  const a = document.activeElement;
  if (a && (a.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))) return;

});


/* ============ ROUTING ============ */
// views: today | project | cheat | <week id>[-lesson|-exercises|-quiz|-sunday]
let view = "today";
function route(scroll) {
  let h = (location.hash || "#today").slice(1);
  if (h === "path" || h === "") h = "today";
  const m = h.match(/^(w\d+b?)(?:-(lesson|exercises|quiz|sunday))?$/);
  const week = m && WEEKS.find((w) => w.id === m[1]);
  view = week ? week.id : ["project", "cheat"].includes(h) ? h : "today";
  document.querySelectorAll("[data-nav]").forEach((a) => a.setAttribute("aria-current", a.dataset.nav === view ? "page" : "false"));
  if (week) renderWeek(week.id); else if (view === "project") renderProject(); else if (view === "cheat") renderCheat(); else renderToday();
  document.querySelectorAll("#view code, #view pre").forEach((el) => el.setAttribute("translate", "no"));
  if (scroll) {
    const target = week && m[2] ? document.getElementById(m[2]) : null;
    if (target) target.scrollIntoView(); else window.scrollTo(0, 0);
    const h1 = $("#view h1"); if (h1 && !target) { h1.tabIndex = -1; h1.focus({ preventScroll: true }); }

const render = () => route(false);

document.addEventListener("change", (e) => {
  const t = e.target;

    return;
  }

  if (t.checked && t.closest(".next")) {
    lastTick = WEEKS.flatMap((w) => w.tasks).find((x) => x.id === id) || null;
    save(); render();
    const first = $(".next input"); (first || $(".undo button") || document.body).focus({ preventScroll: true });
    return;
  }
  save();
  if (view === "today") render(); else document.dispatchEvent(new CustomEvent("progress", { detail: { id } }));
});
document.addEventListener("click", (e) => {
  if (e.target.closest("[data-skip]")) { e.preventDefault(); $("#main").focus(); return; }
  const u = e.target.closest("[data-undo]");
  if (u) { delete state.done[u.dataset.undo]; lastTick = null; save(); render(); const f = $(".next input"); if (f) f.focus(); }
});
$(document.documentElement.dataset.look === "olivetti" ? "#look-olivetti" : "#look-orario").checked = true;
route(true);

.prose pre, .codeblock pre { margin: 0; background: var(--code-bg); color: var(--code-ink); padding: 14px 16px; overflow-x: auto; font-size: 0.875rem; line-height: 1.55; border: 1px solid var(--rule); tab-size: 4; }
.prose pre code { background: none; padding: 0; font-size: inherit; }
.copy { order: -1; align-self: flex-end; margin-bottom: -1px; display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 10px; border: 1px solid var(--rule); border-bottom-color: var(--code-bg); border-radius: var(--radius-control) var(--radius-control) 0 0; background: var(--code-bg); color: var(--ink); font: 500 var(--t-s) var(--f-ui); cursor: pointer; }
.copy:hover { border-color: var(--rule-strong); }
.copy svg { width: 14px; height: 14px; }
@media (pointer: coarse) { .copy { min-height: 44px; } }
/* ---- parts ---- */
/* week page */
.wk-steps { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0 20px; font-size: var(--t-s); }
.wk-around { display: flex; flex-wrap: wrap; gap: 0 20px; margin-left: auto; }
.wk-step { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; text-decoration: none; font-weight: 600; }
.wk-step:hover span { text-decoration: underline; text-underline-offset: 0.2em; }
.wk-step svg { width: 16px; height: 16px; flex: none; }
.wk-steps + .weekhead { margin-top: 8px; }
.wk-facts { margin: 18px 0 0; display: grid; gap: 4px; font-size: var(--t-s); }
.wk-facts div { display: grid; grid-template-columns: 9.5rem minmax(0, 1fr); gap: 12px; }
.wk-facts dt { color: var(--muted); font-stretch: var(--label-stretch); font-weight: 600; }
.wk-facts dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.wk-why { margin: 14px 0 0; max-width: 70ch; font-size: var(--t-l); line-height: 1.5; }
.wk-jumps { display: flex; flex-wrap: wrap; align-items: center; gap: 0 22px; margin-top: 20px; padding-block: 2px; border-top: 1px solid var(--rule-strong); border-bottom: 1px solid var(--rule); font-weight: 600; }
.wk-jumps a { display: inline-flex; align-items: center; min-height: 44px; text-decoration: none; }
.wk-jumps a:hover { text-decoration: underline; text-underline-offset: 0.2em; }
.wk-count { margin-left: auto; color: var(--muted); font-weight: 400; font-size: var(--t-s); font-variant-numeric: tabular-nums; }
.wk-lesson { margin-top: 8px; }
.wk-lesson > h2:first-child { margin-top: 1.6em; }
.wk-section { margin-top: 56px; scroll-margin-top: 72px; }
#lesson { scroll-margin-top: 72px; }
.wk-section > h2 { font-size: var(--t-xl); padding-bottom: 8px; border-bottom: 1px solid var(--rule-strong); }
.wk-group { font-size: var(--t-m); margin-top: 26px; color: var(--muted); font-stretch: var(--label-stretch); }
.wk-section > h2 + .wk-group { margin-top: 16px; }
.wk-tasks { list-style: none; margin: 6px 0 0; padding: 0; }
.wk-task { border-bottom: 1px solid var(--rule); }
.wk-task label { display: grid; grid-template-columns: 40px minmax(0, 1fr); align-items: center; min-height: 52px; padding-block: 8px; cursor: pointer; }
.wk-task .wk-tasktext { min-width: 0; overflow-wrap: anywhere; }
.wk-task.wk-done .wk-tasktext { color: var(--muted); }
.wk-intro { margin: 12px 0 0; color: var(--muted); font-size: var(--t-s); max-width: 70ch; }
.wk-quiz { display: grid; gap: 32px; margin-top: 22px; }
.wk-q { max-width: 70ch; scroll-margin-top: 72px; }
.wk-qt { margin: 0; font-weight: 600; font-size: var(--t-l); line-height: 1.45; }
.wk-qn { font-variant-numeric: tabular-nums; color: var(--muted); }
.wk-q .codeblock { margin-top: 10px; }
.wk-opts { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 6px; }
.wk-opt { width: 100%; min-height: 48px; text-align: left; padding: 10px 14px; border: 1px solid var(--rule-strong); border-radius: var(--radius-control); background: var(--ground); color: var(--ink); font: 400 var(--t-m)/1.4 var(--f-ui); cursor: pointer; }
.wk-opt:hover:not([aria-disabled]) { background: var(--code-bg); }
.wk-opt[aria-disabled] { cursor: default; border-color: var(--rule); color: var(--muted); }
.wk-opt.wk-right { background: var(--ok-bg); border-color: var(--ok); color: var(--ink); }
.wk-opt.wk-wrong { background: var(--ground); border: 2px solid var(--ink); color: var(--ink); text-decoration: line-through; text-decoration-thickness: 2px; }
:root[data-look="olivetti"] .wk-opt.wk-wrong { background: var(--bad-bg); border: 1px solid var(--bad); text-decoration: none; }
.wk-opt code { background: none; padding: 0; }
.wk-verdict { margin: 12px 0 0; font-size: var(--t-m); line-height: 1.55; }
.wk-ok { color: var(--ok); }
.wk-no { color: var(--ink); font-weight: 700; }
:root[data-look="olivetti"] .wk-no { color: var(--bad); }
.wk-sunday { margin: 14px 0 0; padding-left: 1.3em; max-width: 70ch; font-size: var(--t-l); line-height: 1.5; }
.wk-sunday li + li { margin-top: 10px; }
.wk-bottom { margin-top: 56px; padding-top: 8px; border-top: 1px solid var(--rule); }
:root[data-look="olivetti"] .wk-opt { border-radius: 0; }
@media (max-width: 600px) {
  .wk-facts div { grid-template-columns: 1fr; gap: 0; }
  .wk-facts div + div { margin-top: 6px; }
  .wk-around { margin-left: 0; width: 100%; justify-content: space-between; }
  .wk-steps .wk-today { width: 100%; }
  .wk-count { margin-left: 0; width: 100%; padding-bottom: 8px; }
}
/* programmatic focus on the title after navigation shouldn't draw a ring */
/* lesson tables scroll sideways inside their wrapper instead of crushing columns */
.wk-lesson th, .wk-lesson td { white-space: nowrap; }
@media (max-width: 600px) {
  .wk-stepname { display: none; }
  .wk-steps:not(.wk-bottom) { flex-wrap: nowrap; }
  .wk-steps:not(.wk-bottom) .wk-today { width: auto; }
  .wk-steps:not(.wk-bottom) .wk-around { width: auto; margin-left: auto; justify-content: flex-end; }
  .wk-jumps { gap: 0 16px; }
}

/* ---- project ---- */
.pj-h1 { font-size: var(--t-xxl); }
.pj-lede { margin: 10px 0 0; color: var(--muted); max-width: 62ch; }
.pj-deadlines { margin: 28px 0 0; border-top: 1px solid var(--rule-strong); }
.pj-deadlines > div { display: grid; grid-template-columns: 11rem minmax(0, 1fr) auto; gap: 4px 16px; align-items: baseline; padding-block: 14px; border-bottom: 1px solid var(--rule); }
.pj-deadlines dt { font-weight: 650; font-variant-numeric: tabular-nums; }
.pj-deadlines dd { margin: 0; color: var(--muted); }
.pj-deadlines .pj-left { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }
.pj-h2 { font-size: var(--t-xl); margin-top: 44px; }
.pj-count { margin: 8px 0 0; color: var(--muted); font-size: var(--t-s); font-variant-numeric: tabular-nums; }
.pj-count b { color: var(--ink); font-weight: 600; }
.pj-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-variant-numeric: tabular-nums; }
.pj-table thead th { text-align: left; font-size: var(--t-s); font-stretch: var(--label-stretch); font-weight: 600; color: var(--muted); padding: 0 12px 6px 0; border-bottom: 1px solid var(--rule-strong); }
.pj-table td, .pj-table tbody th { text-align: left; vertical-align: middle; padding: 8px 12px 8px 0; border-bottom: 1px solid var(--rule); font-weight: 400; }
.pj-table .pj-done { width: 44px; }
.pj-table .pj-done input { display: grid; }
.pj-row { min-height: 52px; }
.pj-id { white-space: nowrap; font-weight: 600 !important; width: 6.5rem; }
.pj-row label { cursor: pointer; display: block; min-height: 28px; padding-block: 4px; }
.pj-tool { color: var(--muted); white-space: nowrap; }
.pj-py .pj-tool { color: var(--ink); font-weight: 600; }
.pj-pymark { width: 7px; height: 7px; fill: var(--route); margin-right: 7px; vertical-align: 1px; }
.pj-prep { white-space: nowrap; }
.pj-prep a { display: inline-flex; align-items: center; min-height: 44px; }
.pj-deadline td { padding: 12px 0; font-weight: 650; border-bottom: 1px solid var(--rule-strong); }
:root[data-look="olivetti"] .pj-deadline td { color: var(--ink); }
.pj-p { max-width: 68ch; margin: 10px 0 0; }
.pj-rules { margin: 10px 0 0; padding-left: 1.2em; max-width: 68ch; }
.pj-rules li + li { margin-top: 0.4em; }
@media (max-width: 600px) {
  .pj-deadlines > div { grid-template-columns: minmax(0, 1fr) auto; }
  .pj-deadlines dd:not(.pj-left) { grid-column: 1 / -1; grid-row: 2; }
  .pj-deadlines .pj-left { grid-row: 1; grid-column: 2; }
  .pj-table thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .pj-table, .pj-table tbody { display: block; }
  .pj-table { border-top: 1px solid var(--rule-strong); }
  .pj-row { display: grid; grid-template-columns: 40px auto minmax(0, 1fr); gap: 0 8px; padding-block: 10px; border-bottom: 1px solid var(--rule); }
  .pj-row > * { border: 0 !important; padding: 0 !important; }
  .pj-row .pj-done { grid-row: 1 / 3; width: auto; padding-top: 2px !important; }
  .pj-id { width: auto; }
  .pj-id label::after { content: " ·"; }
  .pj-what { grid-column: 3; }
  /* tool left, week link right, on one line under the title */
  .pj-tool, .pj-prep { grid-column: 2 / 4; grid-row: 2; font-size: var(--t-s); white-space: nowrap; align-self: center; }
  .pj-prep { justify-self: end; }
  /* keep a 44px tap target without adding a visible gap under the title */
  .pj-prep a { display: inline-flex; align-items: center; min-height: 44px; margin-block: -10px; padding-left: 12px; }
  .pj-deadline { display: block; }
  .pj-deadline td { display: block; }
}

/* ---- Cheat sheet ---- */
#view h1 + .cs-lede { margin: 6px 0 0; color: var(--muted); font-size: var(--t-s); }
.cs-search { position: sticky; top: calc(56px + env(safe-area-inset-top, 0px)); z-index: 4; background: var(--ground); margin-top: 18px; padding-block: 10px 12px; border-bottom: 1px solid var(--rule); }
.cs-search label { display: block; font-size: var(--t-s); font-weight: 600; margin-bottom: 6px; }
.cs-field { position: relative; }
.cs-search input { width: 100%; min-height: 48px; padding: 0 9.5rem 0 14px; border: 1px solid var(--rule-strong); border-radius: var(--radius-control); background: var(--ground); color: var(--ink); font: 400 var(--t-m) var(--f-ui); }
.cs-search input::placeholder { color: var(--muted); }
.cs-search input:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
.cs-count { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: var(--t-s); font-variant-numeric: tabular-nums; pointer-events: none; }
.cs-index { margin-top: 18px; }
.cs-index summary { cursor: pointer; min-height: 44px; display: flex; align-items: center; gap: 10px; font-weight: 600; list-style: none; }
.cs-index summary::-webkit-details-marker { display: none; }
.cs-index summary::before { content: ""; width: 8px; height: 8px; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: rotate(-45deg); transition: transform 0.15s ease-out; }
.cs-index[open] summary::before { transform: rotate(45deg); }
@media (prefers-reduced-motion: reduce) { .cs-index summary::before { transition: none; } }
.cs-index ul { list-style: none; margin: 0; padding: 0; columns: 3 12rem; column-gap: 24px; font-size: var(--t-s); }
.cs-index li { break-inside: avoid; }
.cs-index a { display: flex; align-items: center; min-height: 36px; color: var(--link); text-decoration: none; }
.cs-index a:hover { text-decoration: underline; }
.cs-empty { margin-top: 28px; font-size: var(--t-l); }
.cs-body { margin-top: 12px; }
.cs-sec { border-top: 1px solid var(--rule); padding-top: 4px; }
.cs-sec > h2 { margin-top: 1.4em; scroll-margin-top: calc(56px + 130px + env(safe-area-inset-top, 0px)); }
.cs-sec > h2:focus { outline: none; }
.cs-sec > h2:focus-visible { outline: 2px solid var(--focus); outline-offset: 4px; }
.cs-sec + .cs-sec { margin-top: 2em; }
.cs-body mark.cs-hit { background: var(--select); color: var(--ink); padding: 0; }
@media (min-width: 601px) { .cs-index summary { display: none; } }
@media (max-width: 600px) {
  .cs-index { border-bottom: 1px solid var(--rule); }
  .cs-index ul { columns: 1; padding-bottom: 8px; }
  .cs-index a { min-height: 44px; }
  .cs-search input { padding-right: 8.5rem; }
}

.visually-hidden { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }</style>
</body></html>
