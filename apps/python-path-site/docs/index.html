| `IndexError` | a list position past the end |
| `AttributeError` | a method or attribute the object doesn't have, often `None.something` |
| `ZeroDivisionError` | dividing by 0 |
| `FileNotFoundError` | wrong path, or the terminal is in a different folder |
| `UnicodeDecodeError` | the file isn't in the encoding you opened it with |
| `RecursionError` | recursion without a working base case |

**Watch out.** `AttributeError: 'NoneType' object has no attribute ...` almost always means a function returned `None` (it printed instead of returning, or a `.sort()` result was stored).

### `assert`
`assert condition` does nothing if the condition is true and raises `AssertionError` if it's false.

**What it's for.** Tests (pytest is built on it), and checking assumptions inside your own code while developing.

**How to use it.**
```python
assert add(2, 2) == 4
assert len(facts) == len(source), "rows were lost"
```
**Watch out.** Don't use `assert` to validate user input or data in a real program: Python can be run with assertions turned off (`python -O`). Use `if` + [`raise`](#encyclopedia/raise) for that.

## Files and data formats
Reading and writing data on disk.

### Paths and `pathlib`
A **path** is a file's address. `pathlib.Path` represents one as an object, with methods for the usual questions.

**What it's for.** Building file names that work on every operating system, checking files exist, creating folders, listing files.

**How to use it.**
```python
from pathlib import Path
p = Path("data") / "sales.csv"     # / joins parts correctly on Mac and Windows
p.exists(), p.is_file()
p.name, p.stem, p.suffix           # 'sales.csv', 'sales', '.csv'
p.parent                           # Path('data')
p.parent.mkdir(parents=True, exist_ok=True)
sorted(Path("data").glob("*.csv"))
p.read_text(encoding="utf-8")      # small files only
```
**Watch out.** A **relative** path (`data/sales.csv`) starts from the folder the terminal is in, not from where the script is. Never hard-code absolute paths like `/Users/me/...`: pass paths as [arguments](#encyclopedia/argparse).

### `open`
`open(path, mode, encoding=...)` connects to a file and returns a **file object** to read from or write to.

**What it's for.** Every kind of text file work.

**How to use it.**
```python
with open("notes.txt", encoding="utf-8") as f:           # "r" (read) is the default
    for line in f:                                       # one line at a time
        print(line.rstrip("\n"))

with open("out.txt", "w", encoding="utf-8") as f:        # "w" replaces the file
    f.write("hello\n")                                   # you add the newlines

with open("log.txt", "a", encoding="utf-8") as f:        # "a" appends at the end
    f.write("one more line\n")
```
**Watch out.** Always pass `encoding="utf-8"` (see [encodings](#encyclopedia/encodings)), and always use `with`. `"w"` empties an existing file immediately. `f.read()` loads the whole file: fine for small files, a problem for huge ones.

### `with` (context managers)
`with` runs a block and **guarantees clean-up afterwards**, even if an error happens inside. The object after `with` is a **context manager**: it knows how to set itself up and tear itself down.

**What it's for.** Closing files, closing database connections, releasing anything that must be released.

**How to use it.**
```python
with open(path, encoding="utf-8") as f:
    data = f.read()
# here the file is already closed, whatever happened inside

with open(src, encoding="utf-8") as fin, open(dst, "w", encoding="utf-8") as fout:
    for line in fin:
        fout.write(line.upper())
```
**Watch out.** The file is only usable inside the indented block. A generator that reads a file inside `with` keeps it open until the generator is used up.

### Encodings
An **encoding** is the rule that turns characters into bytes on disk and back. **UTF-8** is the modern standard and can store every character.

**What it's for.** Reading "è", "€" and emoji correctly, on every computer.

**How to use it.**
```python
open(path, encoding="utf-8")                     # always say it
open(path, encoding="utf-8", errors="replace")   # bad bytes become � instead of crashing
"città".encode("utf-8")                          # b'citt\xc3\xa0': the bytes
```
**Watch out.** Without `encoding=`, Python uses the computer's default, which differs between Mac and Windows: the same script then reads text differently on each. A `UnicodeDecodeError` means the file isn't in the encoding you said (often old files are `latin-1`).

### CSV and the `csv` module
**CSV** (comma-separated values) stores a table as text: one row per line, values separated by commas, usually with a header line. The `csv` module reads and writes it correctly.

**What it's for.** The most common way tables travel between programs.

**How to use it.**
```python
import csv
with open("in.csv", encoding="utf-8", newline="") as f:
    for row in csv.DictReader(f):            # one dict per row, keys from the header
        qty = int(row["qty"])                # every value is a string

with open("out.csv", "w", encoding="utf-8", newline="") as f:
    w = csv.DictWriter(f, fieldnames=["id", "name"])
    w.writeheader()
    w.writerows(rows)
```
**Watch out.** Never split lines with `.split(",")`: values can contain commas inside quotes (`"Rossi, Mario"`), which the module handles. Always pass `newline=""`. Use `delimiter=";"` for semicolon files.

### JSON
**JSON** is a text format for nested data: objects, arrays, strings, numbers, `true`/`false`, `null`. It maps directly onto Python dicts, lists, str, int/float, `True`/`False` and `None`.

**What it's for.** Web APIs, configuration files, data exports.

**How to use it.**
```python
import json
with open("data.json", encoding="utf-8") as f:
    data = json.load(f)                    # file -> Python objects
with open("out.json", "w", encoding="utf-8") as f:
    json.dump(data, f, indent=2, ensure_ascii=False)
json.loads('{"a": null}')                  # string -> {'a': None}
json.dumps({"ok": True})                   # Python -> '{"ok": true}'
```
**Watch out.** `load`/`dump` work with files, `loads`/`dumps` (with **s**) with strings. JSON keys are always strings, so a dict with int keys comes back with string keys. Large dumps are often **JSON Lines**: one object per line, read line by line with `json.loads`.

### XML and ElementTree
**XML** stores data as nested **elements** written with tags, which can carry **attributes**: `<row id="1"><city>Pisa</city></row>`. Python reads it with `xml.etree.ElementTree`.

**What it's for.** Many older systems and data exports use it.

**How to use it.**
```python
import xml.etree.ElementTree as ET
root = ET.parse("data.xml").getroot()     # the whole tree in memory
for el in root.iter("row"):               # every <row>, at any depth
    el.attrib["id"]                       # an attribute
    el.findtext("city")                   # the text of a child element

for event, el in ET.iterparse("huge.xml", events=("end",)):   # streaming
    if el.tag == "row":
        ...
        el.clear()                        # free memory as you go
```
**Watch out.** `ET.parse` loads everything; for files of hundreds of MB use `iterparse` and `clear()`. Values are always strings.

### ARFF
**ARFF** is the data format of the Weka tool: a header that names and types the columns, then CSV-like data.

**What it's for.** Datasets from data-mining courses and tools, including part of the DSS data.

**How to use it.** The format looks like this:
```text
% a comment
@relation sales
@attribute stor_id numeric
@attribute payterms {'Net 60','Net 30'}
@data
6380,'Net 60'
7066,?
```
`@attribute` lines give names and types (split with `line.split(maxsplit=2)`, because the type can contain spaces), and after `@data` each line is a row. Read the data lines with `csv.reader(lines, quotechar="'", skipinitialspace=True)`.

**Watch out.** `?` means missing. Text uses single quotes. Keywords are case-insensitive. Real files mix quote styles and contain commas and apostrophes inside text, so test your parser on nasty rows.

## Classes and objects
Defining your own types of data.

### Classes and objects
A **class** is a blueprint for a new type of value. An **object** (or **instance**) is one value made from that blueprint. The class says what data each object holds (**attributes**) and what it can do (**methods**).

**What it's for.** Keeping data and the functions that work on it together. A `BankAccount` holds a balance and knows how to deposit; a `Book` holds a title and knows how to describe itself. One of the two P4DS exam exercises is always a class model.

**How to use it.**
```python
class Account:
    def __init__(self, owner, balance=0):
        self.owner = owner
        self.balance = balance

    def deposit(self, amount):
        self.balance += amount

a = Account("Ada")        # create an object (an instance of Account)
b = Account("Alan", 50)   # another, independent one
a.deposit(20)
a.balance, b.balance      # 20, 50
```
**Watch out.** You've used objects all along: `"pisa".upper()` calls the `upper` method of a `str` object. A class is the same idea, defined by you. Related: [`__init__`](#encyclopedia/__init__), [`self`](#encyclopedia/self), [methods](#encyclopedia/methods).

### `__init__`
The method Python calls **automatically when an object is created**. It sets up the new object's starting attributes. It's often called the **constructor**.

**What it's for.** Making sure every object starts complete and valid: every account has an owner and a balance from the first moment.

**How to use it.**
```python
class Book:
    def __init__(self, title, author, pages):
        if pages <= 0:
            raise ValueError("pages must be positive")
        self.title = title          # store each input on the object
        self.author = author
        self.pages = pages
        self.loans = []             # attributes don't have to come from inputs

b = Book("Dune", "Herbert", 412)    # Python calls __init__(b, "Dune", "Herbert", 412)
b.title                             # 'Dune'
```
When you write `Book(...)`, Python creates an empty object, passes it to `__init__` as `self` together with your arguments, and gives you the object.

**Watch out.** Two underscores on each side: `_init_` or `__init` won't be called. `__init__` must not `return` a value. Forgetting `self.` (`title = title`) creates a local variable that disappears, so the object never gets the attribute.

### `self`
The first parameter of every method: **the object the method was called on**.

**What it's for.** Letting a method read and change *this particular* object's attributes.

**How to use it.**
```python
class Counter:
    def __init__(self):
        self.n = 0
    def add(self):
        self.n += 1          # this object's n

c1, c2 = Counter(), Counter()
c1.add()                     # Python runs Counter.add(c1): self is c1
c1.n, c2.n                   # 1, 0
```
**Watch out.** You don't pass `self` yourself; Python fills it in from the object before the dot. Forgetting it in the definition (`def add():`) gives `TypeError: add() takes 0 positional arguments but 1 was given`. The name `self` is a convention, but always use it.

### Attributes
Values stored **on an object**, read and written with a dot: `obj.name`.

**What it's for.** Holding each object's own data.

**How to use it.**
```python
b = Book("Dune", "Herbert", 412)
b.pages             # read
b.pages = 420       # change
b.rating = 5        # add a new one (possible, but better to set all in __init__)
vars(b)             # all of them as a dict
```
**Watch out.** A misspelled attribute name when reading raises `AttributeError`; when assigning, it silently creates a new attribute. Set every attribute in `__init__`, so the object's shape is clear in one place.

### Methods
Functions defined **inside a class**. They're called on an object and receive it as [`self`](#encyclopedia/self).

**What it's for.** The operations that make sense for that type: an account deposits, a book describes itself, a library finds a book.

**How to use it.**
```python
class Account:
    def __init__(self, balance=0):
        self.balance = balance
    def withdraw(self, amount):
        if amount > self.balance:
            raise ValueError("insufficient funds")
        self.balance -= amount
        return self.balance

acc = Account(100)
acc.withdraw(30)      # 70
```
**Watch out.** A method that should give back a result must `return` it, like any function. Methods that only change the object usually return `None`.

### `__str__` and `__repr__`
Two special methods that turn an object into text. `__str__` is the friendly version used by `print()` and `str()`. `__repr__` is the precise version used at the prompt, in lists and in debugging.

**What it's for.** Without them, printing an object shows `<__main__.Book object at 0x10a3...>`, which tells you nothing.

**How to use it.**
```python
class Book:
    def __init__(self, title, pages):
        self.title, self.pages = title, pages
    def __str__(self):
        return f"{self.title} ({self.pages} pages)"
    def __repr__(self):
        return f"Book({self.title!r}, {self.pages})"

b = Book("Dune", 412)
print(b)          # Dune (412 pages)
[b]               # [Book('Dune', 412)]
```
**Watch out.** Both must **return** a string, not print it. If you define only `__repr__`, `print` uses it too. `!r` in an f-string uses the repr of a value (quotes around strings).

### Dunder methods
Methods with **d**ouble **under**scores on both sides, like `__init__`, `__str__`, `__len__`, `__eq__`, `__lt__`. Python calls them for you when you use built-in syntax on your objects.

**What it's for.** Making your objects work with `len()`, `==`, `<`, `+`, `in`, `for` and `sorted`, like built-in types.

**How to use it.**
```python
class Playlist:
    def __init__(self, songs):
        self.songs = songs
    def __len__(self):                 # len(p)
        return len(self.songs)
    def __contains__(self, song):      # song in p
        return song in self.songs
    def __eq__(self, other):           # p1 == p2
        return self.songs == other.songs
```
**Watch out.** Without `__eq__`, `==` compares identity: two objects with the same data are not equal. You never call dunder methods directly (`p.__len__()`); use the syntax (`len(p)`).

### Inheritance
A class can be built **on top of another**: the new class (**subclass**, child) gets all the attributes and methods of the existing one (**superclass**, parent), and can add or replace some.

**What it's for.** Related types that share most behaviour: an `Ebook` is a `Book` with a file size; a `SavingsAccount` is an `Account` with interest.

**How to use it.**
```python
class Book:
    def __init__(self, title, pages):
        self.title, self.pages = title, pages
    def describe(self):
        return f"{self.title}, {self.pages} pages"

class Ebook(Book):                         # Ebook inherits from Book
    def __init__(self, title, pages, mb):
        super().__init__(title, pages)     # let Book set title and pages
        self.mb = mb
    def describe(self):                    # override: replace the parent's version
        return super().describe() + f", {self.mb} MB"

e = Ebook("Dune", 412, 2.1)
e.describe()                 # 'Dune, 412 pages, 2.1 MB'
isinstance(e, Book)          # True: an Ebook is a Book
```
**Watch out.** Use inheritance only for a real "is a" relationship. If a class merely *uses* another (a library *has* books), store the other object as an attribute instead.

### `super()`
Inside a method, `super()` gives you the **parent class's version** of the methods.

**What it's for.** Extending the parent's behaviour instead of copying it, most often in `__init__`.

**How to use it.**
```python
class SavingsAccount(Account):
    def __init__(self, owner, balance=0, rate=0.02):
        super().__init__(owner, balance)   # the parent sets owner and balance
        self.rate = rate                   # then add what's new
```
**Watch out.** If a subclass defines `__init__` and forgets to call `super().__init__(...)`, the parent's attributes are never set, and later methods fail with `AttributeError`.

### Class attributes
An attribute defined **in the class body**, outside any method, shared by all objects of that class.

**What it's for.** Constants and shared data: a fee that applies to every account, a count of objects created.

**How to use it.**
```python
class Account:
    fee = 1.5                 # shared by every account
    count = 0
    def __init__(self, owner):
        self.owner = owner    # instance attribute: one per object
        Account.count += 1

Account("Ada"); Account("Alan")
Account.count                 # 2
```
**Watch out.** Writing `self.fee = 2` creates an *instance* attribute that hides the shared one for that object only. A mutable class attribute (a list) is shared by everyone, which is usually a bug: create per-object lists in `__init__`.

### `@property`
Turns a method into something you **read like an attribute**, without brackets.

**What it's for.** Values computed from other attributes, which should always be up to date.

**How to use it.**
```python
class Rectangle:
    def __init__(self, w, h):
        self.w, self.h = w, h
    @property
    def area(self):
        return self.w * self.h

r = Rectangle(3, 4)
r.area          # 12, no brackets
r.w = 10
r.area          # 40: recomputed
```
**Watch out.** You can't assign to it (`r.area = 5` fails) unless you also define a setter. Keep properties fast and without side effects; they look like plain attribute reads.

### `@dataclass`
A [decorator](#encyclopedia/decorators) that **writes `__init__`, `__repr__` and `__eq__` for you** from a list of typed fields.

**What it's for.** Classes that mainly hold data, without the boilerplate.

**How to use it.**
```python
from dataclasses import dataclass, field

@dataclass
class Book:
    title: str
    pages: int
    tags: list = field(default_factory=list)   # a fresh list for each object

b = Book("Dune", 412)
b                     # Book(title='Dune', pages=412, tags=[])
b == Book("Dune", 412)   # True
```
**Watch out.** Fields with defaults must come after fields without. For list or dict defaults use `field(default_factory=list)`, for the same reason as [mutable default arguments](#encyclopedia/mutable-default-arguments). You can still add your own methods.

### Decorators
A line starting with `@` above a function or class. It **wraps** what's below in another function that adds behaviour.

**What it's for.** Adding a feature without changing the code inside: `@property`, `@dataclass`, `@staticmethod`, and in tests `@pytest.mark.parametrize`.

**How to use it.**
```python
@pytest.mark.parametrize("n, expected", [(2, True), (3, False)])
def test_is_even(n, expected):
    assert is_even(n) == expected
```
`@deco` above `def f` means exactly `f = deco(f)`.

**Watch out.** You'll mostly *use* decorators others wrote. Writing your own is rarely needed in this course.

## Standard library
Modules that come with Python: nothing to install.

### `collections.Counter`
A dict made for **counting**: missing keys count as 0.

**What it's for.** Frequencies: words, categories, values in a column.

**How to use it.**
```python
from collections import Counter
c = Counter(["a", "b", "a", "c", "a"])   # Counter({'a': 3, 'b': 1, 'c': 1})
c["a"], c["zzz"]                          # 3, 0 (no KeyError)
c.most_common(2)                          # [('a', 3), ('b', 1)]
c["b"] += 5                               # update like a normal dict
Counter(r["store"] for r in rows)         # count a column
```
**Watch out.** `most_common` breaks ties by first appearance, not alphabetically. If the tie order matters, sort yourself with a [key](#encyclopedia/the-key-argument).

### `collections.defaultdict`
A dict that **creates a default value** the first time a missing key is used.

**What it's for.** Grouping without checking "is this key new?" every time.

**How to use it.**
```python
from collections import defaultdict
groups = defaultdict(list)          # missing key -> a new empty list
for r in rows:
    groups[r["store"]].append(r)
totals = defaultdict(int)           # missing key -> 0
for r in rows:
    totals[r["store"]] += r["qty"]
dict(groups)                        # back to a plain dict
```
**Watch out.** Even *reading* a missing key creates it. Pass the type itself (`list`, `int`), not a call (`list()`).

### `datetime`
The module for **dates, times and durations**.

**What it's for.** Parsing timestamps from data, extracting parts (year, hour, weekday), and computing differences.

**How to use it.**
```python
from datetime import datetime, date, timedelta
dt = datetime.fromisoformat("2024-03-05 21:14:00")
dt.year, dt.month, dt.hour, dt.weekday()       # 2024, 3, 21, 1 (Monday is 0)
datetime.strptime("05/03/2024", "%d/%m/%Y")    # parse a custom layout
dt.strftime("%Y-%m-%d")                        # format: '2024-03-05'
(dt2 - dt1).total_seconds() / 3600             # hours between
dt + timedelta(days=7)                         # one week later
date.today()
```
**Watch out.** `strptime` **p**arses, `strftime` **f**ormats. `weekday()` starts at 0 for Monday. Timestamps without a time zone are "naive"; decide and document which zone your data uses.

### `re` (regular expressions)
**Regular expressions** are a small pattern language for finding and replacing text.

**What it's for.** Extracting hashtags, URLs, numbers; matching whole words; cleaning whitespace.

**How to use it.**
```python
import re
re.findall(r"\d+", "3 posts, 12 likes")                # ['3', '12']
re.findall(r"#(\w+)", "Go #Python!")                   # ['Python']: only the group
re.search(r"\bart\b", "Modern Art", re.IGNORECASE)     # a match (None if absent)
re.sub(r"\s+", " ", "too   many\nspaces")              # 'too many spaces'
re.fullmatch(r"\d{4}-\d{2}-\d{2}", "2024-03-05")       # does the WHOLE string match?
```
Building blocks: `\d` digit, `\w` letter/digit/underscore, `\s` whitespace, `\S` non-whitespace, `.` any character, `+` one or more, `*` zero or more, `?` optional, `{4}` exactly four, `\b` word boundary, `( )` the part to return, `[abc]` one of these characters.

**Watch out.** Always use raw strings (`r"..."`). When the pattern contains a word from a variable, escape it: `re.escape(word)`. Regular expressions get unreadable fast; if string methods can do it, prefer them.

### `statistics`
Basic statistics on lists of numbers.

**What it's for.** Means, medians and spreads for data quality checks and features, without extra libraries.

**How to use it.**
```python
import statistics as st
data = [2, 4, 4, 4, 5, 5, 7, 9]
st.mean(data)        # 5
st.median(data)      # 4.5
st.mode(data)        # 4
st.stdev(data)       # 2.138...  sample standard deviation
st.pstdev(data)      # 2.0       population standard deviation
```
**Watch out.** `stdev` needs at least two values and raises `StatisticsError` with fewer; `mean` of an empty list raises too. Remove `None` values first.

### `math`
Mathematical functions and constants.

**What it's for.** Square roots, rounding up or down, logarithms, comparing floats.

**How to use it.**
```python
import math
math.sqrt(16), math.pi           # 4.0, 3.14159...
math.ceil(2.1), math.floor(2.9)  # 3, 2
math.log(100, 10)                # 2.0
math.isclose(0.1 + 0.2, 0.3)     # True: the right way to compare floats
math.inf                         # infinity, a handy starting value for a minimum
```
**Watch out.** `round(2.5)` is `2` and `round(3.5)` is `4`: Python rounds halves to the even number. Use `math.floor(x + 0.5)` if you need "always up" for positive numbers.

### `random`
Pseudo-random numbers and choices.

**What it's for.** Sampling data, shuffling, simulations, test data.

**How to use it.**
```python
import random
random.seed(42)                  # same "random" results every run: reproducible
random.random()                  # a float in [0, 1)
random.randint(1, 6)             # 1 to 6, both included
random.choice(["a", "b"])
random.sample(rows, 100)         # 100 different rows
random.shuffle(cards)            # in place
```
**Watch out.** Set a seed whenever results go in a report, so others can reproduce them. `randint` includes both ends, unlike `range`.

### `os` and `sys`
`os` talks to the operating system (environment variables, files). `sys` talks to the Python interpreter itself (command-line arguments, exit, version).

**What it's for.** Reading settings and credentials from the environment, getting arguments, ending with an exit code.

**How to use it.**
```python
import os, sys
os.environ["DB_USER"]            # an environment variable (KeyError if unset)
os.environ.get("DEBUG", "0")     # with a default
os.getcwd()                      # the current folder
sys.argv                         # ['script.py', 'arg1', ...]
sys.version_info                 # the Python version
sys.exit(1)                      # stop with exit code 1
```
**Watch out.** For paths, prefer [`pathlib`](#encyclopedia/paths-and-pathlib) over `os.path`. For arguments, use [`argparse`](#encyclopedia/argparse) rather than reading `sys.argv` by hand.

### `argparse`
Turns command-line arguments into named, typed values, with automatic `--help` and error messages.

**What it's for.** Scripts others can run on their own data without editing your code.

**How to use it.**
```python
import argparse
from pathlib import Path
p = argparse.ArgumentParser(description="Split sales into star-schema tables.")
p.add_argument("input", type=Path)                        # required, positional
p.add_argument("--out-dir", type=Path, default=Path("out"))
p.add_argument("--dry-run", action="store_true")          # a flag: True if present
p.add_argument("-v", "--verbose", action="count", default=0)   # -v = 1, -vv = 2
args = p.parse_args()                    # reads sys.argv; tests pass a list instead
args.input, args.out_dir, args.dry_run
```
**Watch out.** Dashes in option names become underscores in `args` (`--out-dir` becomes `args.out_dir`). With `type=int`, a wrong value makes argparse print an error and exit with code 2.

### `logging`
Messages about **what a program is doing**, with levels of importance you can turn up or down.

**What it's for.** Progress and diagnostics (rows read, rows rejected, timings) that you can see with `-v` and hide otherwise, without deleting `print`s.

**How to use it.**
```python
import logging
log = logging.getLogger(__name__)
logging.basicConfig(level=logging.INFO, format="%(levelname)s %(message)s")
log.debug("details")            # hidden at INFO
log.info("read %d rows", 2104)
log.warning("%d rows skipped", 3)
log.error("file not found: %s", path)
```
Levels, from least to most important: `DEBUG`, `INFO`, `WARNING`, `ERROR`, `CRITICAL`.

**Watch out.** The default level is `WARNING`, so `log.info` shows nothing until you configure it. Logging writes to stderr, separately from the program's real output. Pass values as arguments (`"%d rows", n`) rather than with f-strings.

### `sqlite3`
A complete SQL database **built into Python**, stored in one file or in memory.

**What it's for.** Practising SQL and the DB-API without a server; small local databases; tests.

**How to use it.**
```python
import sqlite3
conn = sqlite3.connect(":memory:")       # or "shop.db" for a file
conn.execute("CREATE TABLE t (id INTEGER, name TEXT)")
conn.executemany("INSERT INTO t VALUES (?, ?)", [(1, "a"), (2, "b")])
conn.commit()
conn.execute("SELECT name FROM t WHERE id = ?", (2,)).fetchall()   # [('b',)]
conn.close()
```
**Watch out.** Changes are lost without `commit()`: see [transactions](#encyclopedia/transactions-and-commit). Always use [placeholders](#encyclopedia/sql-placeholders). The same code works for SQL Server through `pyodbc`, with a different `connect`.

### `time`
Clocks, for measuring how long code takes.

**What it's for.** Benchmarks and timing logs: how long did the load take?

**How to use it.**
```python
import time
t0 = time.perf_counter()
load_everything()
log.info("loaded in %.2f s", time.perf_counter() - t0)
time.sleep(0.5)          # pause half a second
```
**Watch out.** Use `perf_counter()` for measuring durations; `time.time()` can jump when the computer's clock is adjusted. Time a few runs: the first is often slower.

## Data engineering ideas
Concepts behind efficient, correct data pipelines.

### Big-O notation
A way of saying **how the work grows** as the data grows. O(1): the same, whatever the size. O(n): proportional to the size. O(n²): the square of the size.

**What it's for.** Predicting whether code that works on 100 rows will still work on 10 million.

**How to use it.**
| Operation | Cost |
|---|---|
| `x in some_list` | O(n): checks items one by one |
| `x in some_set`, `key in some_dict` | O(1): jumps straight there |
| looping over all rows | O(n) |
| a loop inside a loop over the same rows | O(n²) |
| sorting | O(n log n) |

With 1,000,000 rows, O(n) is a million steps; O(n²) is a million million, which can take days.

**Watch out.** The usual fix for O(n²) code is a [dict](#encyclopedia/dict) or [set](#encyclopedia/set) built once before the loop, turning each inner search into an O(1) lookup.

### Streaming versus loading
**Loading** reads all the data into memory before working on it. **Streaming** processes it one piece at a time, so only the current piece is in memory.

**What it's for.** Handling files and query results larger than your computer's memory.

**How to use it.**
```python
data = f.read()                  # loading: the whole file at once
for line in f:                   # streaming: one line at a time
    ...
rows = cur.fetchall()            # loading
while chunk := cur.fetchmany(1000):   # streaming in chunks
    ...
```
**Watch out.** Building a list "just to have it" (`rows = list(reader)`) turns a stream back into a load. Streams can be read only once. Related: [generators](#encyclopedia/generators-and-yield).

### Batching
Processing items in **groups** of a fixed size instead of one by one or all at once.

**What it's for.** Database inserts: one round trip per 1,000 rows instead of per row, while memory stays small.

**How to use it.**
```python
def batched(items, n):
    batch = []
    for x in items:
        batch.append(x)
        if len(batch) == n:
            yield batch
            batch = []
    if batch:
        yield batch                  # the last, shorter group

for batch in batched(read_rows(path), 1000):
    cur.executemany(sql, batch)
```
**Watch out.** Don't forget the final partial batch. Python 3.12+ also has `itertools.batched`, which yields tuples.

### SQL placeholders
Marks like `?` in a SQL statement, filled in by the database driver with values you pass separately.

**What it's for.** Safety and correctness: values with quotes (`O'Brien`) just work, and malicious text can't run as SQL (**SQL injection**).

**How to use it.**
```python
cur.execute("SELECT * FROM users WHERE name = ? AND age > ?", (name, 30))
cur.executemany("INSERT INTO t (a, b) VALUES (?, ?)", rows)
```
**Watch out.** Never build SQL with f-strings or `+` from data. Placeholders work only for **values**; table and column names can't be placeholders, so check them yourself (for example with `name.isidentifier()`). Some drivers use `%s` or `:name` instead of `?`.

### Transactions and commit
A **transaction** is a group of database changes that succeed or fail together. `commit()` makes them permanent; `rollback()` (or closing without committing) throws them away.

**What it's for.** Never leaving the database half-updated: if a load crashes halfway, nothing from it is saved.

**How to use it.**
```python
try:
    cur.executemany(insert_sql, rows)
    conn.commit()            # all of it
except Exception:
    conn.rollback()          # none of it
    raise
```
**Watch out.** Forgetting `commit()` means your inserts vanish when the connection closes. Committing after every row is very slow; commit once per load or per large batch.

### Star schema
A database layout for analysis: one central **fact table** of events, with **dimension tables** around it describing the who, what, where and when.

**What it's for.** Fast, simple analytical queries, and the base for OLAP cubes.

**How to use it.**
```text
          dim_date
             │
dim_store ── fact_sales ── dim_title
```
The fact table holds **measures** (numbers to add up, like quantity) and **foreign keys** to the dimensions. The dimensions hold descriptive attributes (store city, title name, season). Design it in this order: grain, measures, dimensions, keys.

**Watch out.** First decide the **grain**: what one fact row represents (one sale line? one post?). Mixing grains in one table gives wrong totals. Load dimensions before facts.

### Surrogate keys
An artificial integer key (1, 2, 3...) that **you** assign to each dimension row, instead of using the source system's own identifier.

**What it's for.** Small, fast joins; independence from how the source names things; a key even when the source has none.

**How to use it.**
```python
key_of = {}
for r in rows:
    if r["store"] not in key_of:
        key_of[r["store"]] = len(key_of) + 1     # next number
fact = {"store_key": key_of[r["store"]], "qty": r["qty"]}
```
**Watch out.** Keep the natural value as a column in the dimension too, so you can trace back. Dates often use a readable key like `20240305` instead.

### Exit codes
The number a program returns to the system when it ends. `0` means success; anything else means failure.

**What it's for.** Scripts, schedulers and CI decide what to do next from it: run the next step, or stop and alert.

**How to use it.**
```python
def main():
    if not ok:
        return 1
    return 0

if __name__ == "__main__":
    sys.exit(main())
```
In the terminal, `echo $?` shows the last command's exit code.

**Watch out.** A script that catches an error, prints it and then ends normally exits with `0`, so everything downstream thinks it worked.

### Environment variables
Named settings that live **in the terminal session**, outside your code, readable with `os.environ`.

**What it's for.** Passwords, server names and anything that differs between machines, kept out of the code and out of git.

**How to use it.**
```bash
export DB_USER=ada          # Mac/Linux, this terminal only
```
```python
import os
user = os.environ["DB_USER"]
```
Many projects keep them in a `.env` file that is listed in `.gitignore`.

**Watch out.** Never commit credentials, not even "just for now": git keeps them in history forever. If it happens, change the password.

## Tools
What you use around the code.

### Terminal basics
The **terminal** runs commands you type. It's always inside one folder, the **current directory**.

**What it's for.** Running scripts, tests, git and installers.

**How to use it.**
| Command | Does |
|---|---|
| `pwd` | show the current folder |
| `ls` | list files (`dir` on Windows) |
| `cd folder`, `cd ..`, `cd ~` | move into a folder, up one, home |
| `mkdir name` | create a folder |
| `python file.py` | run a script |
| Tab | complete a file name |
| ↑ | previous command |
| Ctrl+C | stop the running program |

**Watch out.** Most "file not found" errors mean the terminal is in a different folder from the one you think. Check with `pwd`.

### git
A **version control** tool: it records snapshots (**commits**) of your project, so you can see what changed and go back. **GitHub** stores a copy online.

**What it's for.** Never losing work, collaborating, and showing your code.

**How to use it.**
```bash
git init                       # once: start tracking this folder
git status                     # what changed?
git add file.py                # stage it for the next snapshot
git commit -m "Parse ARFF dates"   # take the snapshot
git log --oneline              # history
git push                       # upload to GitHub
git pull                       # download others' changes
```
**Watch out.** `git add` stages the file as it is at that moment; later edits need another `add`. List `.venv/`, `.env` and data files in `.gitignore` so they're never committed.

### pytest
A tool that finds and runs **tests**: functions named `test_*` in files named `test_*.py`, which check results with `assert`.

**What it's for.** Proving code works, and noticing immediately when a change breaks something.

**How to use it.**
```python
# tests/test_prices.py
from prices import vat

def test_vat():
    assert vat(100) == 122
```
```bash
pytest                         # run everything
pytest tests/test_prices.py -v # one file, one line per test
pytest -k vat                  # only tests with "vat" in the name
pytest -x                      # stop at the first failure
```
**Watch out.** Never change a test to make it pass; the test is the specification. Run pytest from the project's top folder, inside the activated venv.

### The debugger
A tool that **pauses your program** on a line you choose, so you can inspect every variable and run one line at a time.

**What it's for.** Finding bugs by watching values change, instead of guessing or adding `print` everywhere.

**How to use it.** In VS Code:

1. Click left of a line number to set a **breakpoint** (a red dot).
2. Start with **Run › Start Debugging** (F5), or the debug icon next to a test.
3. When it stops, read variables in the left panel or by hovering.
4. **F10** runs the next line, **F11** steps into a function call, **F5** continues to the next breakpoint.

You can also write `breakpoint()` in the code to stop there.

**Watch out.** Before each step, predict what the variables will be. The first surprise is where the bug is.
</script>
<script type="text/markdown" id="md-w0">
## What this week is for
By the end of this week you will have a working setup: a terminal you can find your way around, a project folder with its own Python, a test you can run, a debugger you can step through, and the whole thing saved on GitHub. There is very little Python in it. Everything after this week assumes these tools work, so it is worth doing slowly and properly.

You will write Python in **`.py` files** (scripts), not in Jupyter notebooks. A notebook remembers whatever cells you ran, in whatever order you ran them: run cell 5, edit cell 2, rerun cell 7, and the result depends on a history nobody else can see. A `.py` file runs from the first line to the last, the same way every time, on any computer. That is why it can be tested, saved in git, reviewed by someone else and run on a server. The DSS project scripts run for minutes against a real database, so they have to be scripts.

## The pieces and how they fit
```text
Terminal ──runs──▶ python (from .venv) ──reads──▶ exercises/w00_setup.py
   │                         ▲
   └── pytest ── imports ────┘      git ── snapshots ──▶ GitHub
```
You type commands in the **terminal**. One of those commands starts **Python**, which reads your file and runs it. Another starts **pytest**, which loads your file and checks that your functions give the right answers. **git** keeps a history of your folder, and **GitHub** keeps a copy of that history online. The sections below take these one at a time.

## The terminal
The terminal is a window where you control the computer by typing instead of clicking. On a Mac it's the *Terminal* app (or the terminal panel inside VS Code: **View › Terminal**). On Windows, use *PowerShell* or the VS Code terminal.

The most important idea: **the terminal is always "standing" inside one folder**, called the *current directory*. Every relative path you type starts from there. These are the commands you need this week:

| Command | What it does | Example |
|---|---|---|
| `pwd` | prints the folder you're in ("print working directory") | `/Users/ada/code` |
| `ls` | lists what's in it (`dir` on Windows) | `exercises  tests  README.md` |
| `cd name` | moves into a folder | `cd python-path` |
| `cd ..` | moves up one folder | |
| `cd ~` | goes to your home folder | |

Try it: open a terminal, run `pwd`, then `ls`, then `cd` into a folder you saw, then `pwd` again. If a command says *No such file or directory*, you're almost always in the wrong folder: run `pwd` and check.

Two keys save a lot of typing: **Tab** completes a file or folder name, and the **up arrow** brings back your previous command.

## Running a Python file
A `.py` file is just text. Create `hello.py` containing one line:
```python
print("Hello from a script")
```
and run it from the terminal, in the folder that contains it:
```bash
python hello.py
```
Python reads the file from top to bottom and runs each line. `print(...)` writes text to the terminal, so you see `Hello from a script`. If you see `can't open file 'hello.py'`, you're not in the folder that contains it.

On a Mac the command may be `python3` until you activate a virtual environment (next section). After activating, plain `python` works.

## Virtual environments: one private Python per project
Python projects use extra packages (pytest this week, pyodbc later). If you install them all into one shared Python, projects end up needing different versions of the same package and break each other. A **virtual environment** (venv) is a private folder, `.venv/`, holding a copy of Python and only this project's packages.

You create it once per project:
```bash
cd ~/code/python-path
python3 -m venv .venv               # create the .venv folder
```
and **activate** it every time you open a new terminal:
```bash
source .venv/bin/activate           # Mac/Linux
.venv\Scripts\Activate.ps1          # Windows PowerShell
```
Activation changes one thing: when you type `python` or `pip`, the terminal now uses the ones inside `.venv`. Your prompt shows `(.venv)` at the start, and you can check:
```bash
which python                        # should end in /python-path/.venv/bin/python
```
Now install packages *into* the venv:
```bash
python -m pip install pytest
```
Writing `python -m pip` instead of plain `pip` guarantees that pip installs into the same Python you'll run.

Finally tell VS Code to use it: **Cmd+Shift+P › Python: Select Interpreter**, then pick the one in `.venv`.

**Common trap:** you open a new terminal tab, forget to activate, and suddenly "pytest is not installed" or a test about the venv fails. The fix is always the same: `source .venv/bin/activate`.

## Functions and tests, the smallest possible version
Every exercise on this site is a **function**: a named piece of code that takes inputs and gives back a result. You'll learn functions properly in week 1. For now, read this one:
```python
def double(x):          # "def" starts a function called double, with one input x
    return x * 2        # "return" hands the result back
```
`double(5)` gives back `10`. The indented lines belong to the function.

A **test** is another function that calls yours and checks the answer with `assert`:
```python
def test_double():
    assert double(5) == 10      # == asks "are these equal?"
    assert double(0) == 0
```
`assert something` does nothing when `something` is true, and stops with an error when it's false. **pytest** finds every file named `test_*.py` in `tests/`, runs every function named `test_*`, and prints a report: a green dot for each passing test, and an explanation for each failing one.

In the exercise files, each function starts as a *stub*: the description is written, and the body is `raise NotImplementedError`, which means "not written yet". So the first time you run the tests, everything fails. That's on purpose. The daily loop is:

1. Run the tests and see red: `pytest tests/test_w00_setup.py`
2. Read the description of one function, and replace `raise NotImplementedError` with your code.
3. Run the tests again. Repeat until that function's test is green.

To run only the tests whose name contains a word, add `-k`: `pytest tests/test_w00_setup.py -k hello`. Add `-v` to see one line per test.

Never change a test to make it pass. The test is the specification: if it disagrees with your code, your code is wrong (or you've misread the task).

## Reading a traceback
When Python hits an error it prints a **traceback**: the list of function calls that were running when it crashed.
```text
Traceback (most recent call last):
  File ".../tests/test_w00_setup.py", line 24, in test_average_of_positive_no_positives
    assert average_of_positive([]) == 0.0
  File ".../exercises/w00_setup.py", line 54, in average_of_positive
    return total / count
ZeroDivisionError: division by zero
```
Read it **from the bottom up**:

- The **last line** says *what* went wrong: `ZeroDivisionError: division by zero`.
- The frame just above says *where*: `w00_setup.py`, line 54, the line `return total / count`.
- The frames above that say *how you got there*: the test on line 24 called your function with `[]`, an empty list.

Put those together and you have the bug: with an empty list, `count` is 0, and you divide by it. Frames inside Python's own libraries (paths containing `site-packages` or `lib/python3`) are almost never where the bug is; look for the first frame in **your** files.

## The debugger: watching your code run
`print()` shows you one value at one moment. A **debugger** pauses the program on a line you choose and lets you look at every variable, then move forward one line at a time.

In VS Code:

1. Open the file and click in the margin to the left of a line number. A red dot appears: that's a **breakpoint**.
2. Open the Testing panel (the flask icon) and click the debug icon next to a test, or use **Run › Start Debugging** (F5) on a script.
3. Execution stops at the red dot. The **Variables** panel on the left shows every variable and its current value. Hovering over a name in the code shows it too.
4. Press **F10** ("step over") to run one line and stop again. Watch the variables change. **F11** ("step into") goes inside a function call. **F5** continues to the next breakpoint.

The exercise `average_of_positive` has three planted bugs. Don't stare at the code trying to spot them. Put a breakpoint on the `for` line, step through with the input `[2, -1, 4]`, and after each step ask: "is `total` what I expect? is `count`?" The moment a value surprises you, you've found a bug.

## git and GitHub: saving snapshots
**git** records snapshots (called *commits*) of your project folder, so you can see what changed, when, and go back. Three commands do most of the work:
```bash
git status                     # what changed since the last snapshot?
git add exercises/w00_setup.py # choose what goes into the next snapshot (the "staging area")
git commit -m "Week 0: hello and python_version"   # take the snapshot, with a message
```
`add` copies the file *as it is now* into the staging area. If you edit it again after `add`, `git status` shows it as modified again, and you need another `add` for the new version to be included.

Once, at the start of a project:
```bash
git init                       # turn the folder into a repository
```
**GitHub** is a website that stores a copy of your repository. With the GitHub command line tool:
```bash
gh auth login                  # once per computer
gh repo create python-path --private --source=. --push   # create the online copy and upload
git push                       # afterwards: upload new commits
```
Some files must **never** be committed: `.venv/` (thousands of machine-specific files; anyone can rebuild it), `.env` (passwords), and large data files. The repository's `.gitignore` file lists them so git ignores them. Run `git status` before every commit and read what's about to go in.

## Try it yourself
Before the exercises, do these in a scratch file `playground.py` and run it each time:

1. Print your name, then your name in capital letters (`"ada".upper()`).
2. Write a function `triple(x)` that returns `x * 3`, call it, and print the result.
3. Divide a number by zero and read the traceback bottom-up. Which line does it point to?
4. Set a breakpoint on your `print` line, start the debugger, and step over it.

> **Remember**
> - The terminal is always inside one folder. Lost? `pwd`.
> - New terminal: `source .venv/bin/activate`, then check `which python`.
> - Red, then code, then green. Never edit a test to make it pass.
> - Read tracebacks from the bottom. Find the first line in your own file.
> - `git status` before every commit. `.venv/`, `.env` and data files never go in git.
</script>
<script type="text/markdown" id="md-w1">
## What this week is for
Every program you'll write in this course, from a CSV reader to a database loader, is built from five things: **values**, **names**, **conditions**, **loops** and **functions**. This week covers each one from zero, with examples you can type and run. The goal is fluency: by Friday, writing a loop with a condition inside should take you seconds, not minutes.

The best way to read this lesson is with a terminal open. Type `python` (in your activated venv) to start the **interactive prompt**, shown as `>>>`. Anything you type there runs immediately and shows its result. Try every example; change it; break it on purpose. Type `exit()` to leave.

## Values and their types
Every piece of data in Python is a **value**, and every value has a **type** that decides what you can do with it.
```python
>>> 42          # int: a whole number
42
>>> 3.5         # float: a number with a decimal point
3.5
>>> "Pisa"      # str: text, in single or double quotes
'Pisa'
>>> True        # bool: True or False (capital T and F)
True
>>> None        # NoneType: "no value here"
>>> type(3.5)
<class 'float'>
```
`None` deserves a mention: it means "nothing", and it shows up a lot in real data for missing values. It's not `0` and not `""`; it's its own thing.

### Arithmetic
```python
>>> 7 + 2, 7 - 2, 7 * 2
(9, 5, 14)
>>> 7 / 2       # true division: ALWAYS gives a float
3.5
>>> 7 // 2      # floor division: the whole part, rounded down
3
>>> 7 % 2       # modulo: the remainder of 7 // 2
1
>>> 2 ** 10     # power
1024
```
`%` is more useful than it looks. `n % 2` is `0` when `n` is even and `1` when it's odd. `n % 10` is the last digit of `n`. `n // 10` is `n` without its last digit.

Floats are stored in binary, so some decimals can't be exact:
```python
>>> 0.1 + 0.2
0.30000000000000004
```
This isn't a Python bug; every language does it. Never compare floats with `==` when they come from calculations: round them, or check that the difference is tiny.

### Converting between types
```python
>>> int("42")       # text to int
42
>>> float("2.5")
2.5
>>> str(7)          # number to text
'7'
>>> int("4.2")      # not a whole number: error
ValueError: invalid literal for int() with base 10: '4.2'
>>> "3" + 4         # Python never converts silently
TypeError: can only concatenate str (not "int") to str
```
This matters immediately in week 3: everything you read from a file is a string, even `"42"`, and you have to convert it on purpose.

## Names (variables)
A **name** is a label you attach to a value with `=`:
```python
qty = 5
price = 12.5
total = qty * price     # Python computes the right side first, then attaches the name
print(total)            # 62.5
```
`=` means "make this name refer to this value", not "is equal to". That's why this line makes sense:
```python
qty = qty + 1           # take the current qty (5), add 1, attach the name qty to the result (6)
qty += 1                # the same thing, shorter
```
Names are case-sensitive (`qty` and `Qty` are different), can contain letters, digits and `_`, and can't start with a digit. By convention Python uses `lower_case_with_underscores`.

## Strings
A string is a sequence of characters. Each character has a position called an **index**, starting at **0**:
```text
 s =   " P  y  t  h  o  n "
index:   0  1  2  3  4  5
from end:-6 -5 -4 -3 -2 -1
```
```python
>>> s = "Python"
>>> s[0]            # first character
'P'
>>> s[-1]           # negative indexes count from the end
'n'
>>> len(s)          # number of characters
6
```
### Slicing: taking a piece
`s[start:stop]` gives the characters from `start` up to **but not including** `stop`:
```python
>>> s[0:2]
'Py'
>>> s[2:]           # from index 2 to the end
'thon'
>>> s[:3]           # from the start to index 3 (excluded)
'Pyt'
>>> s[::-1]         # a third number is the step; -1 walks backwards
'nohtyP'
```
"Stop is excluded" seems odd at first, but it means `s[:3] + s[3:]` is always the whole string, and `s[a:b]` always has `b - a` characters.

### Methods: things a string can do
A **method** is a function that belongs to a value, called with a dot:
```python
>>> name = "  ada LOVELACE "
>>> name.strip()            # remove spaces at both ends
'ada LOVELACE'
>>> name.lower(), name.upper()
('  ada lovelace ', '  ADA LOVELACE ')
>>> name.strip().title()
'Ada Lovelace'
>>> "a,b,c".split(",")      # cut into a list at each comma
['a', 'b', 'c']
>>> "  two   words ".split()   # no argument: cut at any run of spaces, drop the empty bits
['two', 'words']
>>> "-".join(["a", "b", "c"])  # the opposite of split: glue a list together
'a-b-c'
>>> "data" in "big data"       # is one string inside another?
True
>>> "abc".startswith("a"), "x1".isalpha(), "42".isdigit()
(True, False, True)
```
**Strings never change.** A method like `upper()` doesn't modify the string; it returns a **new** one. If you don't keep it, it's gone:
```python
s = "data"
s.upper()           # creates "DATA" and throws it away
print(s)            # data
s = s.upper()       # keep the new string by attaching the name to it
print(s)            # DATA
```
### f-strings: putting values inside text
Put an `f` before the quotes, and anything inside `{ }` is computed and inserted:
```python
>>> store, qty, price = "S1", 5, 12.5
>>> f"{store}: {qty} x {price} = {qty * price}"
'S1: 5 x 12.5 = 62.5'
>>> f"{price:.2f}"          # after the colon: a format. .2f = 2 decimals
'12.50'
>>> f"[{qty:4d}]"           # 4d = an integer, right-aligned in 4 characters
'[   5]'
```

## Booleans and conditions
A **comparison** produces `True` or `False`:
```python
>>> 5 > 3, 5 == 3, 5 != 3, 5 >= 5
(True, False, True, True)
>>> 0 <= 7 <= 10            # chained: is 7 between 0 and 10?
True
```
Note `==` (compare) versus `=` (attach a name). Mixing them up is the most common beginner typo.

Combine comparisons with `and`, `or`, `not`:
```python
>>> age = 25
>>> age >= 18 and age < 65
True
>>> not (age > 30)
True
```
### if / elif / else
`if` runs a block of code only when a condition is true. The block is the **indented** lines under it; indentation is part of Python's grammar, always 4 spaces:
```python
temperature = 31
if temperature > 30:
    print("hot")            # runs only if the condition is True
    print("drink water")    # still inside the if: same indentation
print("done")               # back at the left edge: always runs
```
With several cases, Python checks them **from top to bottom and runs only the first true one**:
```python
if temperature > 30:
    label = "hot"
elif temperature > 15:      # only checked if the first condition was False
    label = "mild"
else:                       # runs if nothing above was True
    label = "cold"
```
Because only the first match runs, **order matters**. If you check `temperature > 15` first, then 35 is labelled "mild", because 35 > 15 is also true and Python never reaches the "hot" branch. When ranges overlap, put the most specific (or the highest threshold) first.

### Truthiness
`if` doesn't need a real `True`/`False`. Python treats these as false: `0`, `0.0`, `""` (empty string), `[]`, `{}`, and `None`. Everything else counts as true. So:
```python
name = ""
if not name:                # catches "" and None in one go
    print("name is missing")
```
Careful: `bool("False")` is `True`, because it's a non-empty string.

## Loops
### for: do something for each item
A `for` loop takes the items of a sequence one by one, attaches a name to each, and runs the block:
```python
for letter in "abc":
    print(letter)           # a, then b, then c

for word in ["red", "green"]:
    print(word.upper())     # RED, then GREEN
```
To repeat something a number of times, loop over `range`:
```python
>>> list(range(5))          # 0 up to 5, excluded (like slicing)
[0, 1, 2, 3, 4]
>>> list(range(2, 6))       # from 2 up to 6, excluded
[2, 3, 4, 5]
>>> list(range(0, 10, 3))   # step 3
[0, 3, 6, 9]
```
When you need the position **and** the item, use `enumerate`:
```python
for i, city in enumerate(["Pisa", "Lucca"]):
    print(i, city)          # 0 Pisa, then 1 Lucca
```
### while: repeat until something changes
A `while` loop repeats as long as its condition is true. Use it when you **don't know in advance** how many steps it will take:
```python
balance = 100
years = 0
while balance < 200:        # checked before every round
    balance = balance * 1.07
    years += 1
print(years)                # 11: how many years at 7% to double the money
```
If the condition never becomes false, the loop never ends. Something inside the loop must move towards the exit (here, `balance` grows). Press Ctrl+C to stop a runaway program.

`break` leaves a loop immediately; `continue` skips to the next round.

### The accumulator pattern
Most loops you'll write this week follow one shape: start a result, update it for each item, use it after the loop.
```python
def count_long_words(text):
    count = 0                       # 1. start the accumulator
    for word in text.split():       # 2. loop over the pieces
        if len(word) > 3:           # 3. decide whether this item matters
            count += 1              # 4. update
    return count                    # 5. after the loop (not indented under for!)
```
Trace it by hand with `"the quick brown fox"`: `count` goes 0 → 0 ("the") → 1 ("quick") → 2 ("brown") → 2 ("fox"), and the function returns 2.

The same shape builds strings (`result = ""`, then `result += ...`) and lists (`result = []`, then `result.append(...)`).

The classic bug is indenting `return` one level too far, inside the loop. Then the function returns after the **first** item, every time.

## Functions
A **function** packages a piece of code under a name, so you can run it with different inputs:
```python
def vat_price(net, rate=0.22):
    """Return the price including VAT."""
    return net * (1 + rate)
```
- `def` starts the definition; `vat_price` is the name; `net` and `rate` are **parameters**, the names the inputs get inside the function.
- `rate=0.22` is a **default value**: if the caller doesn't give a rate, it's 0.22.
- The text in triple quotes is the **docstring**: a description for humans. Every exercise's docstring is its specification.
- `return` sends a value back to whoever called the function, and **ends the function immediately**.

Calling it:
```python
>>> vat_price(100)              # rate takes its default
122.0
>>> vat_price(100, 0.10)        # or give it explicitly
110.00000000000001
>>> vat_price(100, rate=0.04)   # by name: clearer when there are several parameters
104.0
```
### return versus print
This confuses almost everyone at the start. `print` **shows** a value to a human, on the screen. `return` **gives** a value to the code that called the function, so it can be stored, compared or used in a calculation.
```python
def shout_print(word):
    print(word.upper())

def shout_return(word):
    return word.upper()

a = shout_print("hi")       # shows HI on screen, but a is None
b = shout_return("hi")      # shows nothing, but b is "HI"
```
A function with no `return` returns `None`. Tests check what you **return**, so in the exercises, never `print` the answer; `return` it.

### Returning early
Because `return` ends the function, you can leave as soon as you know the answer:
```python
def has_negative(numbers):
    for n in numbers:
        if n < 0:
            return True         # found one: no need to look further
    return False                # only reached if the loop finished without finding one
```

## Errors on purpose: raise and try
Sometimes the right thing for a function to do is refuse bad input. `raise` stops the function with an error:
```python
def percent(part, whole):
    if whole <= 0:
        raise ValueError("whole must be positive")
    return part / whole * 100
```
The opposite side is `try` / `except`: try something that might fail, and decide what happens if it does.
```python
text = "4.2"
try:
    n = int(text)           # raises ValueError
except ValueError:
    n = None                # we land here instead of crashing
```
Week 3 covers this properly. For now, `safe_int` uses exactly this pattern.

## Try it yourself
Type these at the `>>>` prompt or in `playground.py`:

1. What do `17 // 5`, `17 % 5` and `-17 // 5` give? Predict first.
2. Take `"  Decision Support Systems "` and produce `"DSS"` using `split()` and a loop.
3. Write a function `count_char(text, ch)` that counts how often `ch` appears, with a loop (not `.count`).
4. Write a `while` loop that prints the powers of 2 below 1000.
5. Write `describe(n)` that returns `"negative"`, `"zero"` or `"positive"`, then call it with `-3`, `0`, `8`.

> **Remember**
> - `=` attaches a name, `==` compares.
> - Indentation is grammar: 4 spaces mark what's inside an `if`, `for`, `while` or `def`.
> - `range(a, b)` and `s[a:b]` stop **before** `b`.
> - Strings never change: `s.upper()` returns a new string you must keep.
> - Only the first true branch of an `if/elif` chain runs, so order matters.
> - `return` gives a value back and ends the function. A function without it returns `None`.
</script>
<script type="text/markdown" id="md-w2">
## What this week is for
Last week you worked with single values. Real data comes in collections: a list of posts, a table of sales, the set of users you've already seen. Python has four built-in containers, and this week you learn what each is for, how they behave, and how to combine them into **tables**. The DSS project doesn't allow pandas, so a list of dicts *is* your dataframe: grouping, counting and joining are loops you'll write yourself. Get this week right and the project becomes plumbing.

## Lists: an ordered, changeable sequence
A **list** holds any number of values, in order, between square brackets:
```python
>>> scores = [70, 85, 92]
>>> scores[0], scores[-1]           # indexing works like strings
(70, 92)
>>> scores[1:]                      # slicing too
[85, 92]
>>> len(scores)
3
```
Unlike strings, lists **can change in place**:
```python
>>> scores.append(60)               # add at the end
>>> scores
[70, 85, 92, 60]
>>> scores[0] = 75                  # replace one item
>>> scores.remove(92)               # remove the first item equal to 92
>>> scores.pop()                    # remove and return the last item
60
>>> scores
[75, 85]
>>> scores.extend([50, 99])         # add every item of another list
>>> 85 in scores                    # membership: is it in the list?
True
```
Useful built-in functions work on any list of numbers: `sum(scores)`, `min(scores)`, `max(scores)`, `sorted(scores)`.

### Sorting: a new list or the same list
```python
>>> nums = [3, 1, 2]
>>> sorted(nums)            # returns a NEW sorted list; nums is unchanged
[1, 2, 3]
>>> nums.sort()             # sorts nums itself, and returns None
>>> nums
[1, 2, 3]
```
So `x = nums.sort()` leaves `x` equal to `None`: a classic mistake. Use `sorted()` when you want the result as a value.

To sort by something other than the value itself, pass a **key**: a function applied to each item, whose result is used for comparing.
```python
>>> words = ["banana", "fig", "apple"]
>>> sorted(words, key=len)                  # by length
['fig', 'apple', 'banana']
>>> sorted(words, key=len, reverse=True)    # longest first
['banana', 'apple', 'fig']
```
A **lambda** is a tiny function written inline: `lambda w: w[-1]` means "given `w`, return its last letter".
```python
>>> sorted(words, key=lambda w: w[-1])      # by last letter
['banana', 'apple', 'fig']
```
To sort by two things, return a tuple: Python compares the first items, and only on a tie looks at the second. To sort one of them in descending order, negate it (numbers only):
```python
people = [("Ada", 36), ("Alan", 41), ("Grace", 36)]
sorted(people, key=lambda p: (-p[1], p[0]))   # oldest first, then by name
# [('Alan', 41), ('Ada', 36), ('Grace', 36)]
```

## Tuples: a fixed group of values
A **tuple** is like a list that can't change. Use it for a fixed record where each position has a meaning:
```python
>>> point = (43.7, 10.4)            # (latitude, longitude)
>>> lat, lon = point                # unpacking: one name per position
>>> lat
43.7
>>> point[0] = 0
TypeError: 'tuple' object does not support item assignment
```
Functions return several values as a tuple: `return low, high` returns `(low, high)`, and the caller writes `low, high = f(...)`. You've already seen unpacking in `for i, city in enumerate(...)`.

## Names point at objects: aliasing
This is the one idea in this week that causes real bugs, so slow down here.

A name doesn't *contain* a list; it **points at** a list somewhere in memory. Assigning one name to another makes them point at **the same** list:
```python
a = [1, 2]
b = a           # b points at the same list as a: no copy is made
b.append(3)
print(a)        # [1, 2, 3]: there was only ever one list
```
```text
a ──┐
    ├──▶ [1, 2, 3]
b ──┘
```
To get an independent list, copy it:
```python
c = a.copy()    # or list(a), or a[:]
c.append(4)
print(a)        # [1, 2, 3]: unchanged
```
The same happens with function arguments: a function receives the caller's list, not a copy. If the function calls `.append` on it, the caller's list changes. A function that should not affect its input must copy it first, or build a new list.

Strings, numbers and tuples can't change, so with them aliasing never surprises you: every "change" makes a new object.

One more trap that follows from this: **don't add or remove items in a list while you're looping over it.** The loop skips items in confusing ways. Build a new list instead.

## Dicts: look things up by key
A **dict** (dictionary) maps **keys** to **values**. You look up a value by its key, not by position:
```python
>>> ages = {"Ada": 36, "Alan": 41}
>>> ages["Ada"]
36
>>> ages["Grace"] = 85          # add a new key, or replace an existing value
>>> "Alan" in ages              # checks the KEYS
True
>>> ages["Linus"]
KeyError: 'Linus'
>>> ages.get("Linus")           # get: None instead of an error
>>> ages.get("Linus", 0)        # or a default of your choice
0
```
Looping over a dict:
```python
for name in ages:                    # the keys
    ...
for name, age in ages.items():       # key and value together
    print(f"{name} is {age}")
list(ages.values())                  # [36, 41, 85]
```
Dicts keep keys in the order they were inserted.

Keys must be **hashable**, which in practice means unchangeable: strings, numbers and tuples work; lists don't (`TypeError: unhashable type: 'list'`). A tuple key is how you index by two things at once: `sales[("S1", 1994)] = 120`.

### Why dicts are fast
Finding something in a list means checking items one by one: for a million items, up to a million comparisons. A dict computes where a key lives from the key itself (a *hash*) and goes straight there: one step, whatever the size. Computer scientists write this as **O(n)** for the list and **O(1)** for the dict. When you have a loop over a million rows and do a lookup in each, that's the difference between a second and a day.

### Counting with a dict
The most common dict pattern: count how often each thing appears.
```python
colours = ["red", "blue", "red", "green", "red"]
counts = {}
for c in colours:
    counts[c] = counts.get(c, 0) + 1   # current count (0 if new) plus one
# {'red': 3, 'blue': 1, 'green': 1}
```
Read the key line carefully: `counts.get(c, 0)` is "the count so far, or 0 the first time", then we add 1 and store it back.

## Sets: distinct values, fast membership
A **set** holds unique values, with no order:
```python
>>> tags = {"python", "sql", "python"}
>>> tags
{'python', 'sql'}                   # the duplicate is gone
>>> set([3, 1, 3, 2])               # the quickest way to remove duplicates
{1, 2, 3}
>>> tags.add("etl")
>>> "sql" in tags                   # O(1), like a dict
True
```
Sets support the operations you know from maths:
```python
>>> a, b = {1, 2, 3}, {2, 3, 4}
>>> a & b       # intersection: in both
{2, 3}
>>> a | b       # union: in either
{1, 2, 3, 4}
>>> a - b       # difference: in a but not in b
{1}
```
The "have I seen this before?" pattern uses a set alongside a loop:
```python
seen = set()
for user in user_ids:
    if user in seen:
        print("repeat:", user)
    seen.add(user)
```
Note: `{}` is an empty **dict**. An empty set is `set()`.

### Which container?
| | written as | can change | ordered | `x in` cost | use for |
|---|---|---|---|---|---|
| list | `[1, 2]` | yes | yes | O(n) | sequences, rows |
| tuple | `(1, 2)` | no | yes | O(n) | fixed records, dict keys |
| dict | `{"a": 1}` | yes | insertion order | **O(1)** | lookup by key, grouping, counting |
| set | `{1, 2}` | yes | no | **O(1)** | distinct values, "seen before?" |

## Comprehensions: building a collection in one line
A very common loop builds a new list from an old one:
```python
squares = []
for n in range(5):
    squares.append(n * n)
```
A **list comprehension** says the same thing in one expression:
```python
squares = [n * n for n in range(5)]             # [0, 1, 4, 9, 16]
evens = [n for n in range(10) if n % 2 == 0]    # with a filter: [0, 2, 4, 6, 8]
```
Read it as: "`n * n`, for each `n` in `range(5)`". The same works for sets and dicts:
```python
{w.lower() for w in ["A", "a", "B"]}            # set: {'a', 'b'}
{w: len(w) for w in ["fig", "apple"]}           # dict: {'fig': 3, 'apple': 5}
```
Comprehensions can be nested. A comprehension *inside* another builds a list of lists:
```python
[[r * c for c in range(1, 4)] for r in range(1, 3)]   # [[1, 2, 3], [2, 4, 6]]
```
Use comprehensions for simple transformations and filters. When the logic needs several steps, a normal loop is clearer.

## A table is a list of dicts
Here is the shape you'll use for the rest of the course. One dict per row; the keys are the column names:
```python
rows = [
    {"user": "u1", "hour": 22, "likes": 10},
    {"user": "u2", "hour": 9,  "likes": 3},
    {"user": "u1", "hour": 23, "likes": 7},
]
```
Everything you'd do in SQL or a spreadsheet becomes a loop over `rows`.

**Select a column:**
```python
[r["likes"] for r in rows]                      # [10, 3, 7]
```
**Filter rows (WHERE):**
```python
[r for r in rows if r["hour"] >= 20]            # the two evening rows
```
**Group and sum (GROUP BY user, SUM(likes)):** the counting pattern, adding a value instead of 1:
```python
totals = {}
for r in rows:
    totals[r["user"]] = totals.get(r["user"], 0) + r["likes"]
# {'u1': 17, 'u2': 3}
```
**Group whole rows**, to compute several things per group later:
```python
groups = {}
for r in rows:
    groups.setdefault(r["user"], []).append(r)   # create an empty list the first time
# {'u1': [row0, row2], 'u2': [row1]}
```
**Join two tables** on a shared key. The slow way loops over both tables (for every row in one, scan all rows in the other). The fast way first builds a dict from one table, so each lookup is O(1):
```python
users = [{"user": "u1", "city": "Pisa"}, {"user": "u2", "city": "Lucca"}]
city_of = {u["user"]: u for u in users}         # index: user -> row
joined = []
for r in rows:
    match = city_of.get(r["user"])
    if match is not None:                       # inner join: skip rows without a match
        joined.append({**r, **match})           # merge two dicts into a new one
```
`{**a, **b}` makes a new dict with all keys of `a`, then all keys of `b`.

### Two helpers from the collections module
These save typing once you understand the plain-dict versions above:
```python
from collections import Counter, defaultdict

Counter(r["user"] for r in rows)          # Counter({'u1': 2, 'u2': 1})
Counter("mississippi").most_common(2)     # [('i', 4), ('s', 4)]

by_user = defaultdict(list)               # missing keys start as an empty list
for r in rows:
    by_user[r["user"]].append(r)
```

## Recursion
A function is **recursive** when it calls itself. That sounds circular, but it works when each call handles a **smaller** version of the problem, and there's a **base case** small enough to answer directly.

Example: the sum of a list is "the first item plus the sum of the rest", and the sum of an empty list is 0.
```python
def total(nums):
    if not nums:                    # base case: nothing left
        return 0
    return nums[0] + total(nums[1:])   # one item + the same problem, one item shorter
```
Trace `total([4, 5, 6])`:
```text
total([4, 5, 6]) = 4 + total([5, 6])
                       = 5 + total([6])
                             = 6 + total([])
                                   = 0
                 = 4 + 5 + 6 + 0 = 15
```
Every recursive function needs both parts. Without a base case, or if the problem doesn't get smaller, it calls itself forever, and Python stops it after about 1000 levels with `RecursionError`.

Recursion shines on data that **contains smaller copies of itself**: folders inside folders, lists inside lists, the two halves of a sorted list.
```python
def count_files(folder):            # folder = {"files": [...], "subfolders": [folder, ...]}
    n = len(folder["files"])
    for sub in folder["subfolders"]:
        n += count_files(sub)       # each subfolder is the same problem, smaller
    return n
```
For plain long sequences, a loop is better: it's faster and has no depth limit. The P4DS exam always includes one recursive function, so practise the shape: base case first, then the smaller call.

## Try it yourself
1. Make `a = [1, 2, 3]`, then `b = a`, then `b[0] = 99`. Print `a`. Now repeat with `b = a.copy()`.
2. Count the letters of `"data engineering"` with a dict and `.get`, then with `Counter`. Same result?
3. Given `nums = [5, 3, 8, 1]`, write a comprehension for the numbers above 4, doubled.
4. Sort `[("Pisa", 90000), ("Lucca", 89000), ("Siena", 53000)]` by population, largest first.
5. Write a recursive `count_down(n)` that prints `n, n-1, ..., 1`. What's the base case?

> **Remember**
> - `b = a` doesn't copy. `a.copy()` does.
> - `sorted(x)` returns a new list; `x.sort()` changes `x` and returns `None`.
> - Need "have I seen this?" inside a loop? Use a **set** or a **dict**, never a list.
> - `d[k]` raises KeyError for a missing key; `d.get(k, default)` doesn't.
> - Dict keys must be unchangeable: tuples yes, lists no.
> - Join = index one table in a dict, loop over the other.
> - Recursion = a base case + a call on a smaller problem.
</script>
