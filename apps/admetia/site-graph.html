<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Admetia — Website Page Navigation Graph</title>
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/fonts.css">
  <style>
    :root {
      --bg: #fff7ef;
      --surface: #fff1e5;
      --card: #ffffff;
      --ink: #262422;
      --muted: #66605c;
      --hair: #e6d9ce;
      --border: rgba(0, 0, 0, 0.12);
      --claret: #990f3d;
      --teal: #0d7680;
      --oxford: #0f5499;
      --amber: #b45309;
      --font-mast: "Source Serif 4", Georgia, serif;
      --font-body: "Hanken Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    [data-theme="dark"] {
      --bg: #111116;
      --surface: #181822;
      --card: #20202c;
      --ink: #edecec;
      --muted: #a3a19e;
      --hair: #2e2e3d;
      --border: rgba(255, 255, 255, 0.12);
      --claret: #e0486c;
      --teal: #22a3af;
      --oxford: #4d90e0;
      --amber: #e6983b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--ink);
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Top Navigation Strip */
    header.graph-header {
      background: var(--surface);
      border-bottom: 1px solid var(--hair);
      padding: 10px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-shrink: 0;
      z-index: 10;
    }

    .brand-wrap {
      display: flex;
      align-items: baseline;
      gap: 12px;
    }

    .brand-title {
      font-family: var(--font-mast);
      font-size: 19px;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: var(--ink);
      text-decoration: none;
    }

    .brand-badge {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      background: var(--claret);
      color: #fff;
      padding: 2px 7px;
      border-radius: 4px;
    }

    .brand-sub {
      font-size: 13px;
      color: var(--muted);
      display: none;
    }
    @media (min-width: 900px) {
      .brand-sub { display: inline; }
    }

    .top-controls {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .scope-selector {
      display: inline-flex;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 2px;
    }

    .scope-btn {
      background: transparent;
      border: none;
      padding: 5px 11px;
      font-size: 12px;
      font-weight: 500;
      color: var(--muted);
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.15s ease;
    }

    .scope-btn.active {
      background: var(--teal);
      color: #fff;
      font-weight: 600;
    }

    .search-box {
      position: relative;
      width: 200px;
    }

    .search-box input {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      color: var(--ink);
      outline: none;
    }

    .search-box input:focus {
      border-color: var(--teal);
    }

    .search-results {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      margin-top: 4px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 6px;
      max-height: 240px;
      overflow-y: auto;
      box-shadow: 0 8px 24px rgba(0,0,0,0.15);
      z-index: 100;
      display: none;
    }

    .search-result-item {
      padding: 7px 10px;
      font-size: 12px;
      cursor: pointer;
      border-bottom: 1px solid var(--hair);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .search-result-item:hover {
      background: var(--surface);
    }

    .theme-toggle-btn, .zoom-btn {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--ink);
      padding: 5px 9px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
    }

    /* Main Container */
    .main-layout {
      flex: 1;
      display: flex;
      position: relative;
      overflow: hidden;
    }

    #canvas-container {
      flex: 1;
      height: 100%;
      position: relative;
      cursor: grab;
      user-select: none;
    }

    #canvas-container:active {
      cursor: grabbing;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Floating Journeys & Filters Toolbar */
    .floating-toolbar {
      position: absolute;
      top: 14px;
      left: 16px;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      padding: 8px 12px;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
      max-width: calc(100vw - 380px);
      z-index: 5;
    }

    [data-theme="dark"] .floating-toolbar {
      background: rgba(32, 32, 44, 0.88);
    }

    .toolbar-row {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .toolbar-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin-right: 4px;
    }

    .pill-btn {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--ink);
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 12px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s ease;
    }

    .pill-btn:hover {
      background: var(--surface);
    }

    .pill-btn.active {
      background: var(--ink);
      color: var(--bg);
      border-color: var(--ink);
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
    }

    .journey-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--ink);
      font-size: 11px;
      padding: 4px 9px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
    }

    .journey-btn:hover {
      background: var(--card);
      border-color: var(--teal);
    }

    .journey-btn.active {
      background: var(--teal);
      color: #fff;
      border-color: var(--teal);
    }

    /* Floating Canvas Controls (bottom-left) */
    .canvas-hud {
      position: absolute;
      bottom: 16px;
      left: 16px;
      display: flex;
      gap: 6px;
      z-index: 5;
    }

    /* Right Inspector Drawer */
    aside.inspector-panel {
      width: 320px;
      background: var(--surface);
      border-left: 1px solid var(--hair);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      flex-shrink: 0;
      z-index: 6;
      box-shadow: -4px 0 20px rgba(0,0,0,0.03);
    }

    @media (max-width: 820px) {
      aside.inspector-panel {
        position: absolute;
        right: 0;
        bottom: 0;
        top: 0;
        transform: translateX(100%);
        transition: transform 0.25s ease;
      }
      aside.inspector-panel.open {
        transform: translateX(0);
      }
    }

    .panel-header {
      padding: 16px;
      border-bottom: 1px solid var(--hair);
    }

    .panel-group-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 2px 7px;
      border-radius: 4px;
      color: #fff;
      margin-bottom: 8px;
    }

    .panel-title {
      font-family: var(--font-mast);
      font-size: 20px;
      font-weight: 700;
      line-height: 1.25;
      margin-bottom: 4px;
    }

    .panel-path {
      font-family: monospace;
      font-size: 11px;
      color: var(--muted);
      word-break: break-all;
    }

    .panel-body {
      padding: 16px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .panel-desc {
      font-size: 13px;
      line-height: 1.55;
      color: var(--ink);
    }

    .open-page-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: var(--teal);
      color: #fff;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      padding: 8px 14px;
      border-radius: 6px;
      text-align: center;
      transition: background 0.15s ease;
    }

    .open-page-btn:hover {
      opacity: 0.9;
    }

    .connections-block h4 {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
    }

    .link-chips {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .link-chip {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      transition: all 0.15s ease;
      text-align: left;
    }

    .link-chip:hover {
      border-color: var(--teal);
      transform: translateX(2px);
    }

    .chip-label {
      font-weight: 600;
      color: var(--ink);
    }

    .chip-rel {
      font-size: 10px;
      color: var(--muted);
      text-align: right;
    }

    .empty-state {
      padding: 30px 16px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }
  </style>
</head>
<body data-theme="light">

  <header class="graph-header">
    <div class="brand-wrap">
      <a href="index.html" class="brand-title">Admetia</a>

      <div class="search-box">
        <input type="text" id="node-search" placeholder="Search pages..." autocomplete="off">
        <div class="search-results" id="search-results"></div>

      <button class="theme-toggle-btn" id="theme-btn" title="Toggle theme">◐ Theme</button>
    </div>
  </header>

  <div class="main-layout">
    <div id="canvas-container">
      <canvas id="graph-canvas"></canvas>

      <!-- Floating Journeys & Pillar Filter -->
      <div class="floating-toolbar">

        <div class="toolbar-row">

          <button class="pill-btn" data-filter="map"><span class="dot" style="background:#0284c7"></span>Atlas</button>
          <button class="pill-btn" data-filter="method"><span class="dot" style="background:#990f3d"></span>Method</button>
        </div>
      </div>

      <!-- Canvas zoom HUD -->
      <div class="canvas-hud">
        <button class="zoom-btn" id="zoom-in" title="Zoom in">+</button>
        <button class="zoom-btn" id="zoom-out" title="Zoom out">-</button>
        <button class="zoom-btn" id="zoom-fit" title="Fit graph to screen">Reset View</button>
      </div>
    </div>

    <!-- Inspector Drawer -->
    <aside class="inspector-panel" id="inspector">
      <div id="inspector-content">
        <div class="empty-state">
          <p><strong>Click on any page node</strong> in the graph to inspect its purpose, pathways, and direct navigation links.</p>
          <p style="margin-top: 10px; font-size: 12px;">You can also drag nodes to rearrange the graph, or use the scroll wheel to zoom.</p>
        </div>
      </div>
    </aside>
  </div>

    function initScope(scope) {
      currentScope = scope;
      let targetNodes = [];
      let targetLinks = [];

      if (scope === 'core') {
        targetNodes = JSON.parse(JSON.stringify(GRAPH_DATA.coreNodes));
        targetLinks = JSON.parse(JSON.stringify(GRAPH_DATA.coreLinks));
      } else if (scope === 'ecosystem') {

        const validIds = new Set(targetNodes.map(n => n.id));

      }

      // Initialize coordinates in radial or tree-like clusters
      const angleStep = (2 * Math.PI) / targetNodes.length;
      targetNodes.forEach((n, i) => {
        const radius = n.level === 1 ? 0 : (n.level === 2 ? 160 : (n.level === 3 ? 290 : 420));
        const theta = i * angleStep;
        n.x = Math.cos(theta) * radius + (Math.random() - 0.5) * 40;
        n.y = Math.sin(theta) * radius + (Math.random() - 0.5) * 40;

        n.vy = 0;

    // Physics Simulation step
    function stepSimulation() {
      const repulsion = currentScope === 'core' ? 3200 : 2000;
      const springLength = currentScope === 'core' ? 120 : 90;
      const springStiffness = 0.04;
      const centerGravity = 0.008;

      // 1. Repulsion between all pairs
      for (let i = 0; i < nodes.length; i++) {
        const a = nodes[i];
        for (let j = i + 1; j < nodes.length; j++) {
          const b = nodes[j];
          let dx = b.x - a.x;
          let dy = b.y - a.y;
          let dist = Math.sqrt(dx * dx + dy * dy) || 1;
          if (dist < 600) {
            let force = repulsion / (dist * dist);
            let fx = (dx / dist) * force;
            let fy = (dy / dist) * force;
            a.vx -= fx;
            a.vy -= fy;
            b.vx += fx;
            b.vy += fy;
          }
        }
      }

      // 2. Spring attraction along links
      const nodeMap = new Map(nodes.map(n => [n.id, n]));
      for (const l of links) {
        const source = nodeMap.get(l.source);
        const target = nodeMap.get(l.target);
        if (!source || !target) continue;

        let dx = target.x - source.x;
        let dy = target.y - source.y;
        let dist = Math.sqrt(dx * dx + dy * dy) || 1;
        let diff = dist - springLength;
        let fx = (dx / dist) * diff * springStiffness;
        let fy = (dy / dist) * diff * springStiffness;

        source.vx += fx;
        source.vy += fy;
        target.vx -= fx;
        target.vy -= fy;
      }

      // 3. Center gravity and update position
      for (const n of nodes) {
        if (n === draggedNode) continue;
        n.vx -= n.x * centerGravity;
        n.vy -= n.y * centerGravity;

        n.vx *= 0.84; // friction
        n.vy *= 0.84;

        n.x += n.vx;
        n.y += n.vy;
      }
    }

    // Render loop
    function draw() {
      ctx.clearRect(0, 0, width, height);

      ctx.save();
      ctx.translate(panX, panY);
      ctx.scale(zoom, zoom);

      const nodeMap = new Map(nodes.map(n => [n.id, n]));
      const isDark = document.body.getAttribute('data-theme') === 'dark';

      // Determine active highlight set
      let highlightedNodes = new Set();
      let highlightedLinks = new Set();

      if (currentJourney && JOURNEYS[currentJourney]) {
        JOURNEYS[currentJourney].forEach(id => highlightedNodes.add(id));
      } else if (selectedNodeId) {
        highlightedNodes.add(selectedNodeId);
        links.forEach((l, idx) => {
          if (l.source === selectedNodeId || l.target === selectedNodeId) {
            highlightedNodes.add(l.source);
            highlightedNodes.add(l.target);
            highlightedLinks.add(idx);
          }
        });
      }

      // Draw Links
      links.forEach((l, idx) => {
        const source = nodeMap.get(l.source);
        const target = nodeMap.get(l.target);
        if (!source || !target) return;

        // Filter check
        if (currentFilter !== 'all' && source.group !== currentFilter && target.group !== currentFilter) {
          return;
        }

        const isHighlighted = highlightedLinks.has(idx) || (currentJourney && highlightedNodes.has(l.source) && highlightedNodes.has(l.target));
        const isDimmed = (selectedNodeId || currentJourney) && !isHighlighted;

        ctx.beginPath();
        ctx.moveTo(source.x, source.y);

        // Curved link
        const midX = (source.x + target.x) / 2 + (target.y - source.y) * 0.12;
        const midY = (source.y + target.y) / 2 - (target.x - source.x) * 0.12;
        ctx.quadraticCurveTo(midX, midY, target.x, target.y);

        if (isHighlighted) {
          ctx.strokeStyle = isDark ? '#22a3af' : '#0d7680';
          ctx.lineWidth = 2.4;
          ctx.globalAlpha = 0.95;
        } else if (isDimmed) {
          ctx.strokeStyle = isDark ? '#3a3a4c' : '#e6d9ce';
          ctx.lineWidth = 1;
          ctx.globalAlpha = 0.25;
        } else {
          ctx.strokeStyle = isDark ? '#444458' : '#cdbcae';
          ctx.lineWidth = 1.3;
          ctx.globalAlpha = 0.6;
        }
        ctx.stroke();

        // Arrow head
        const arrowDist = target.size + 4;
        const dx = target.x - midX;
        const dy = target.y - midY;
        const angle = Math.atan2(dy, dx);
        const arrowX = target.x - Math.cos(angle) * arrowDist;
        const arrowY = target.y - Math.sin(angle) * arrowDist;

        ctx.fillStyle = ctx.strokeStyle;
        ctx.beginPath();
        ctx.moveTo(arrowX, arrowY);
        ctx.lineTo(arrowX - 7 * Math.cos(angle - Math.PI / 6), arrowY - 7 * Math.sin(angle - Math.PI / 6));
        ctx.lineTo(arrowX - 7 * Math.cos(angle + Math.PI / 6), arrowY - 7 * Math.sin(angle + Math.PI / 6));
        ctx.closePath();
        ctx.fill();

        // Draw link label when highlighted
        if (isHighlighted && l.label && zoom > 0.75) {
          ctx.font = '10px Hanken Grotesk, sans-serif';
          ctx.fillStyle = isDark ? '#edecec' : '#262422';
          ctx.globalAlpha = 0.85;
          ctx.fillText(l.label, midX, midY - 4);
        }
      });

      // Draw Nodes
      nodes.forEach(n => {
        if (currentFilter !== 'all' && n.group !== currentFilter) return;

        const isSelected = n.id === selectedNodeId;
        const isHovered = n.id === hoveredNodeId;
        const isConnected = highlightedNodes.has(n.id);
        const isDimmed = (selectedNodeId || currentJourney) && !isConnected;

        const groupColor = GROUP_COLORS[n.group]?.bg || '#555';

        ctx.save();
        ctx.translate(n.x, n.y);

        // Halo / selection ring
        if (isSelected || isHovered) {
          ctx.beginPath();
          ctx.arc(0, 0, n.size + 7, 0, Math.PI * 2);
          ctx.fillStyle = isDark ? 'rgba(34, 163, 175, 0.3)' : 'rgba(13, 118, 128, 0.2)';
          ctx.fill();
        }

        // Node Circle
        ctx.beginPath();
        ctx.arc(0, 0, n.size, 0, Math.PI * 2);
        ctx.fillStyle = isDimmed ? (isDark ? '#2a2a38' : '#e0d3c6') : groupColor;
        ctx.globalAlpha = isDimmed ? 0.3 : 1.0;
        ctx.fill();

        ctx.lineWidth = isSelected ? 3 : 1.5;
        ctx.strokeStyle = isSelected ? '#ffffff' : (isDark ? '#111116' : '#ffffff');
        ctx.stroke();

        // Node Label
        ctx.globalAlpha = isDimmed ? 0.35 : 1.0;
        ctx.font = `${n.level <= 2 ? 'bold 12px' : '11px'} "Hanken Grotesk", sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'top';

        const labelY = n.size + 4;
        const text = n.label;
        const textWidth = ctx.measureText(text).width;

        // Label pill background for readability
        ctx.fillStyle = isDark ? 'rgba(24, 24, 34, 0.85)' : 'rgba(255, 247, 239, 0.9)';
        ctx.fillRect(-textWidth / 2 - 4, labelY - 1, textWidth + 8, 14);

        ctx.fillStyle = isDark ? '#edecec' : '#262422';
        ctx.fillText(text, 0, labelY);

        ctx.restore();
      });

      ctx.restore();
    }

    function animate() {
      stepSimulation();
      draw();
      requestAnimationFrame(animate);
    }
    requestAnimationFrame(animate);

    // Inspector Update
    function updateInspector(nodeId) {
      selectedNodeId = nodeId;
      const node = nodes.find(n => n.id === nodeId) || GRAPH_DATA.allNodes.find(n => n.id === nodeId);
      const inspectorContent = document.getElementById('inspector-content');

      if (!node) {
        inspectorContent.innerHTML = `<div class="empty-state">Select a page on the graph to inspect details.</div>`;
        return;
      }

      const groupInfo = GROUP_COLORS[node.group] || { bg: '#666', label: node.group };
      const outgoing = links.filter(l => l.source === node.id);
      const incoming = links.filter(l => l.target === node.id);

      const nodeMap = new Map(GRAPH_DATA.allNodes.map(n => [n.id, n]));

      let html = `
        <div class="panel-header">
          <span class="panel-group-badge" style="background:${groupInfo.bg}">${groupInfo.label}</span>
          <h3 class="panel-title">${node.title || node.label}</h3>
          <div class="panel-path">${node.path}</div>
        </div>
        <div class="panel-body">
          <p class="panel-desc">${node.desc || 'No summary available.'}</p>
          <a href="${node.path}" class="open-page-btn" target="_blank">Open Page in Browser ↗</a>

          <div class="connections-block">
            <h4>Can navigate to (${outgoing.length})</h4>
            <div class="link-chips">
              ${outgoing.length ? outgoing.map(l => {
                const targetNode = nodeMap.get(l.target);
                return `
                  <button class="link-chip" onclick="focusNode('${l.target}')">
                    <span class="chip-label">${targetNode ? targetNode.label : l.target}</span>
                    <span class="chip-rel">${l.label || 'Direct link'}</span>
                  </button>
                `;
              }).join('') : '<div style="font-size:12px;color:var(--muted)">Terminal node (or expands in full view).</div>'}
            </div>
          </div>

          <div class="connections-block">
            <h4>Accessible from (${incoming.length})</h4>
            <div class="link-chips">
              ${incoming.length ? incoming.map(l => {
                const sourceNode = nodeMap.get(l.source);
                return `
                  <button class="link-chip" onclick="focusNode('${l.source}')">
                    <span class="chip-label">${sourceNode ? sourceNode.label : l.source}</span>
                    <span class="chip-rel">${l.label || 'Direct link'}</span>
                  </button>
                `;
              }).join('') : '<div style="font-size:12px;color:var(--muted)">Direct entry point from top navigation.</div>'}
            </div>
          </div>
        </div>
      `;

      inspectorContent.innerHTML = html;
      document.getElementById('inspector').classList.add('open');
    }

    window.focusNode = function(nodeId) {
      selectedNodeId = nodeId;
      const node = nodes.find(n => n.id === nodeId);
      if (node) {
        panX = width / 2 - node.x * zoom;
        panY = height / 2 - node.y * zoom;
      }
      updateInspector(nodeId);
    };

    // Mouse / Touch Interactivity
    function getNodeAt(x, y) {
      const graphX = (x - panX) / zoom;
      const graphY = (y - panY) / zoom;
      for (let i = nodes.length - 1; i >= 0; i--) {
        const n = nodes[i];
        if (currentFilter !== 'all' && n.group !== currentFilter) continue;
        const dx = graphX - n.x;
        const dy = graphY - n.y;
        if (dx * dx + dy * dy <= (n.size + 4) * (n.size + 4)) {
          return n;
        }
      }
      return null;
    }

    container.addEventListener('mousedown', e => {
      const rect = container.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      const hit = getNodeAt(x, y);

      if (hit) {
        draggedNode = hit;
        dragStartX = x;
        dragStartY = y;
        selectedNodeId = hit.id;
        updateInspector(hit.id);
      } else {
        isDragging = true;
        dragStartX = x - panX;
        dragStartY = y - panY;
      }
    });

    container.addEventListener('mousemove', e => {
      const rect = container.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      if (draggedNode) {
        draggedNode.x = (x - panX) / zoom;
        draggedNode.y = (y - panY) / zoom;
        draggedNode.vx = 0;
        draggedNode.vy = 0;
      } else if (isDragging) {
        panX = x - dragStartX;
        panY = y - dragStartY;
      } else {
        const hit = getNodeAt(x, y);
        hoveredNodeId = hit ? hit.id : null;
        container.style.cursor = hit ? 'pointer' : 'grab';
      }
    });

    window.addEventListener('mouseup', () => {
      isDragging = false;
      draggedNode = null;
    });

    container.addEventListener('wheel', e => {
      e.preventDefault();
      const rect = container.getBoundingClientRect();
      const mouseX = e.clientX - rect.left;
      const mouseY = e.clientY - rect.top;

      const factor = e.deltaY < 0 ? 1.12 : 0.89;
      const newZoom = Math.min(Math.max(zoom * factor, 0.3), 3.0);

      panX = mouseX - (mouseX - panX) * (newZoom / zoom);
      panY = mouseY - (mouseY - panY) * (newZoom / zoom);
      zoom = newZoom;
    }, { passive: false });

    // Scope Buttons
    document.querySelectorAll('.scope-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.scope-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        initScope(btn.getAttribute('data-scope'));
      });
    });

    // Pillar Filter Buttons
    document.querySelectorAll('.pill-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.pill-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.getAttribute('data-filter');
        currentJourney = null;
        document.querySelectorAll('.journey-btn').forEach(j => j.classList.remove('active'));
      });
    });

    // Guided Journeys Buttons
    document.querySelectorAll('.journey-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.journey-btn').forEach(b => b.classList.remove('active'));
        const j = btn.getAttribute('data-journey');
        if (j === 'all') {
          currentJourney = null;
        } else {
          btn.classList.add('active');
          currentJourney = j;
        }
      });
    });

    // Search Bar
    const searchInput = document.getElementById('node-search');
    const searchResults = document.getElementById('search-results');

    searchInput.addEventListener('input', () => {
      const q = searchInput.value.toLowerCase().trim();
      if (!q) { searchResults.style.display = 'none'; return; }

      const matches = GRAPH_DATA.allNodes.filter(n =>
        n.label.toLowerCase().includes(q) || n.title.toLowerCase().includes(q) || n.id.toLowerCase().includes(q)
      ).slice(0, 10);

      if (!matches.length) {
        searchResults.style.display = 'none';
        return;
      }

      searchResults.innerHTML = matches.map(m => `
        <div class="search-result-item" onclick="selectSearchResult('${m.id}')">
          <span style="font-weight:600">${m.label}</span>
          <span style="font-size:10px;color:var(--muted)">${m.group}</span>
        </div>
      `).join('');
      searchResults.style.display = 'block';
    });

    window.selectSearchResult = function(nodeId) {
      searchResults.style.display = 'none';
      searchInput.value = '';

      // If node is not in current scope, switch scope to full
      if (!nodes.find(n => n.id === nodeId)) {
        document.querySelectorAll('.scope-btn').forEach(b => b.classList.remove('active'));
        document.querySelector('.scope-btn[data-scope="full"]').classList.add('active');
        initScope('full');
      }

      focusNode(nodeId);
    };

    document.addEventListener('click', e => {
      if (!searchInput.contains(e.target) && !searchResults.contains(e.target)) {
        searchResults.style.display = 'none';
      }
    });

    // Zoom Buttons
    document.getElementById('zoom-in').onclick = () => { zoom = Math.min(zoom * 1.25, 3.0); };
    document.getElementById('zoom-out').onclick = () => { zoom = Math.max(zoom * 0.8, 0.3); };
    document.getElementById('zoom-fit').onclick = () => {
      zoom = 1.0;
      panX = width / 2;
      panY = height / 2;
    };

    // Theme Toggle
    document.getElementById('theme-btn').onclick = () => {
      const isDark = document.body.getAttribute('data-theme') === 'dark';
      document.body.setAttribute('data-theme', isDark ? 'light' : 'dark');
    };

    // Start
    initScope('core');
  </script>
</body>
</html>
