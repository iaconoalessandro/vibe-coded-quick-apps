name: Deploy Vibe Coded Quick Apps to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Admetia
        run: |
          cd apps/admetia
          npm ci
          npm run build
          cd ../..

      - name: Assemble Combined Site
        run: |
          mkdir -p _site
          cp portal.html _site/index.html

          # Admetia
          mkdir -p _site/admetia
          cp -r apps/admetia/_site/* _site/admetia/

          # Python Path Site
          mkdir -p _site/python-path-site
          cp -r apps/python-path-site/docs/* _site/python-path-site/

          # Estonia Relocation Map
          mkdir -p _site/estonia-relocation-map
          cp -r apps/estonia-relocation-map/* _site/estonia-relocation-map/

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
